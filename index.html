<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fysiikka-hiekkalaatikko</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            pointer-events: auto;
            user-select: none;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #3b82f6;
        }
    </style>
</head>
<body>

    <div class="controls shadow-2xl">
        <h1 class="text-xl font-bold mb-4">Kuutio-Sandbox</h1>
        <p class="text-sm opacity-80 mb-4">Raahaa ja heitä kuutiota!</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-xs uppercase font-semibold mb-1">Painovoima</label>
                <input type="range" id="gravitySlider" min="0" max="2" step="0.1" value="0.8">
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold mb-1">Kimmoisuus</label>
                <input type="range" id="bounceSlider" min="0" max="1" step="0.05" value="0.7">
            </div>
            <div>
                <label class="block text-xs uppercase font-semibold mb-1">Kitka</label>
                <input type="range" id="frictionSlider" min="0.8" max="1" step="0.01" value="0.98">
            </div>
            <button id="resetBtn" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-bold transition">Nollaa kuutio</button>
        </div>
    </div>

    <canvas id="sandboxCanvas"></canvas>

    <script>
        const canvas = document.getElementById('sandboxCanvas');
        const ctx = canvas.getContext('2d');
        const gravitySlider = document.getElementById('gravitySlider');
        const bounceSlider = document.getElementById('bounceSlider');
        const frictionSlider = document.getElementById('frictionSlider');
        const resetBtn = document.getElementById('resetBtn');

        // Asetukset
        let settings = {
            gravity: 0.8,
            bounce: 0.7,
            friction: 0.98,
            boxSize: 80
        };

        // Kuution tila
        let box = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            isDragging: false,
            color: '#3b82f6'
        };

        // Hiiren tila
        let mouse = {
            x: 0,
            y: 0,
            lastX: 0,
            lastY: 0,
            down: false
        };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resetBox();
        }

        function resetBox() {
            box.x = canvas.width / 2 - settings.boxSize / 2;
            box.y = canvas.height / 2 - settings.boxSize / 2;
            box.vx = (Math.random() - 0.5) * 20;
            box.vy = -10;
        }

        // Syötteen käsittely
        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function handleStart(e) {
            const pos = getEventPos(e);
            mouse.x = pos.x;
            mouse.y = pos.y;
            mouse.lastX = pos.x;
            mouse.lastY = pos.y;

            if (pos.x >= box.x && pos.x <= box.x + settings.boxSize &&
                pos.y >= box.y && pos.y <= box.y + settings.boxSize) {
                box.isDragging = true;
                box.vx = 0;
                box.vy = 0;
            }
        }

        function handleMove(e) {
            const pos = getEventPos(e);
            mouse.lastX = mouse.x;
            mouse.lastY = mouse.y;
            mouse.x = pos.x;
            mouse.y = pos.y;

            if (box.isDragging) {
                box.x = mouse.x - settings.boxSize / 2;
                box.y = mouse.y - settings.boxSize / 2;
                
                // Lasketaan vauhti raahauksen perusteella
                box.vx = (mouse.x - mouse.lastX) * 0.8;
                box.vy = (mouse.y - mouse.lastY) * 0.8;
            }
        }

        function handleEnd() {
            box.isDragging = false;
        }

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);
        window.addEventListener('resize', resize);

        resetBtn.addEventListener('click', resetBox);

        // Päivityssilmukka
        function update() {
            // Päivitetään asetukset slidereista
            settings.gravity = parseFloat(gravitySlider.value);
            settings.bounce = parseFloat(bounceSlider.value);
            settings.friction = parseFloat(frictionSlider.value);

            if (!box.isDragging) {
                // Lisää painovoima
                box.vy += settings.gravity;

                // Kitka ilmassa (hyvin pieni)
                box.vx *= 0.99;
                box.vy *= 0.99;

                // Päivitä sijainti
                box.x += box.vx;
                box.y += box.vy;

                // Seinätörmäykset
                // Lattia
                if (box.y + settings.boxSize > canvas.height) {
                    box.y = canvas.height - settings.boxSize;
                    box.vy *= -settings.bounce;
                    box.vx *= settings.friction; // Kitka maassa
                    
                    // Pysäytetään pieni tärinä
                    if (Math.abs(box.vy) < 0.5) box.vy = 0;
                }

                // Katto
                if (box.y < 0) {
                    box.y = 0;
                    box.vy *= -settings.bounce;
                }

                // Oikea seinä
                if (box.x + settings.boxSize > canvas.width) {
                    box.x = canvas.width - settings.boxSize;
                    box.vx *= -settings.bounce;
                }

                // Vasen seinä
                if (box.x < 0) {
                    box.x = 0;
                    box.vx *= -settings.bounce;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Piirrä kuution varjo
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(box.x + 5, box.y + 10, settings.boxSize, settings.boxSize);

            // Piirrä kuutio (neliö)
            const gradient = ctx.createLinearGradient(box.x, box.y, box.x + settings.boxSize, box.y + settings.boxSize);
            gradient.addColorStop(0, '#60a5fa');
            gradient.addColorStop(1, '#2563eb');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(box.x, box.y, settings.boxSize, settings.boxSize, 8);
            ctx.fill();

            // Korostusreuna
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Piirrä "kasvot" tai kiilto realistisuuden lisäämiseksi
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(box.x + 5, box.y + 5, settings.boxSize - 10, 10);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Aloitus
        resize();
        loop();
    </script>
</body>
</html>
