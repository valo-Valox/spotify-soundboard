<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS SETTINGS (The "Trusted" way for iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <!-- 'black-translucent' makes the app go UNDER the battery/time bar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Soft UI">

    <!-- ANDROID SETTINGS (The "Trusted" way for Android) -->
    <!-- This embedded manifest forces Android to treat this as a standalone app -->
    <link rel="manifest" href='data:application/manifest+json,{"name":"Soft UI","short_name":"Soft UI","start_url":".","display":"standalone","background_color":"#F0F4F8","theme_color":"#F0F4F8","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/566/566311.png","sizes":"192x192","type":"image/png"}]}'>
    <meta name="theme-color" content="#F0F4F8">
    
    <title>Soft UI App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F0F4F8;
        }

        /* RESET: Locks the app so it doesn't scroll like a website */
        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            position: fixed; /* Anchors the app */
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            color: #5D6D7E;
            background-image: 
                radial-gradient(#E8EEF5 15%, transparent 16%),
                radial-gradient(#E8EEF5 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            /* Extra padding for safe areas (iPhone notch) */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .serif { font-family: 'Playfair Display', serif; }

        /* --- STYLES --- */
        .style-plush {
            background: #FFF0F3;
            border-radius: 30px;
            box-shadow: 12px 12px 24px #e6d3d8, -12px -12px 24px #ffffff;
            border: 2px solid #fff;
        }

        .style-glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(100, 116, 139, 0.15);
        }

        .style-clay {
            background: #E8F5E9;
            border-radius: 50px;
            box-shadow: 8px 8px 16px #cbdacb, -8px -8px 16px #ffffff;
        }

        .style-resin {
            background: linear-gradient(135deg, rgba(226, 219, 245, 0.6), rgba(255, 255, 255, 0.2));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 99px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(159, 122, 234, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        }
        .resin-inset {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 99px;
            box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.05), inset -2px -2px 6px rgba(255, 255, 255, 0.4);
        }

        /* INSTALL OVERLAY (Only visible if NOT in app mode) */
        #install-prompt {
            position: fixed;
            inset: 0;
            background: rgba(240, 244, 248, 0.95);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none; /* Hidden by default */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .notification-area {
            position: fixed;
            bottom: 30px;
            right: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 50;
            pointer-events: none;
            padding-bottom: env(safe-area-inset-bottom); /* Push up for home bar */
        }
        .notification-item {
            pointer-events: auto;
            width: 90%;
            max-width: 360px;
            cursor: pointer;
        }

        /* Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
            opacity: 0.8;
            animation: moveBlob 8s infinite alternate ease-in-out;
        }
        @keyframes moveBlob {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(20px, -20px) scale(1.1); }
        }

        /* Animation Keyframes */
        @keyframes bounceIn { 0% { transform: scale(0.3) translateY(20px); opacity: 0; } 50% { transform: scale(1.05); } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes slideFloat { 0% { transform: translateX(100%) skewX(-5deg); opacity: 0; } 100% { transform: translateX(0) skewX(0); opacity: 1; } }
    </style>
</head>
<body class="flex flex-col items-center p-6 relative h-full">

    <!-- INSTALL PROMPT: Shows only if opened in browser -->
    <div id="install-prompt">
        <div class="mb-6 w-20 h-20 rounded-2xl bg-white shadow-xl flex items-center justify-center text-3xl text-purple-400">
            <i class="fa-solid fa-mobile-screen"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-600 mb-2">Install App</h2>
        <p class="text-slate-500 mb-8 max-w-xs">
            To use Fullscreen:<br>
            Tap <strong>Share</strong> <i class="fa-solid fa-arrow-up-from-bracket"></i> <br>
            Then <strong>Add to Home Screen</strong> <i class="fa-regular fa-square-plus"></i>
        </p>
        <button onclick="document.getElementById('install-prompt').style.display='none'" class="text-sm text-slate-400 underline">
            Continue in Browser (Not Fullscreen)
        </button>
    </div>

    <!-- APP CONTENT -->
    <div class="blob w-64 h-64 bg-pink-200" style="top: 10%; left: 10%;"></div>
    <div class="blob w-80 h-80 bg-blue-200" style="bottom: 10%; right: 10%;"></div>
    
    <!-- Scrollable Area -->
    <div class="w-full h-full overflow-y-auto no-scrollbar pb-32 flex flex-col items-center">
        <header class="text-center mt-8 mb-8 relative z-10">
            <h1 class="text-4xl text-slate-600 serif italic mb-1">The Collection</h1>
            <p class="text-slate-400 font-bold tracking-widest uppercase text-xs">Tap to trigger</p>
        </header>

        <!-- Vertical Mobile Layout -->
        <div class="flex flex-col gap-5 w-full max-w-md relative z-10">
            
            <!-- Plush -->
            <div onclick="notify('plush')" class="style-plush p-4 flex items-center justify-between active:scale-95 transition-transform cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#FFD6E0] shadow-inner flex items-center justify-center text-[#8C5E69]">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-[#8C5E69] serif">Plush</h2>
                        <p class="text-xs text-[#8C5E69]/70">Warm & Matte</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-[#FFD6E0] flex items-center justify-center text-[#8C5E69] text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

            <!-- Glass -->
            <div onclick="notify('glass')" class="style-glass p-4 flex items-center justify-between active:scale-95 transition-transform cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-lg bg-white/20 border border-white/50 flex items-center justify-center text-slate-500">
                        <i class="fa-solid fa-gem"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-slate-600 serif">Glass</h2>
                        <p class="text-xs text-slate-500">Sharp & Clear</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/40 flex items-center justify-center text-slate-500 text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

            <!-- Clay -->
            <div onclick="notify('clay')" class="style-clay p-4 flex items-center justify-between active:scale-95 transition-transform cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#E8F5E9] shadow-[2px_2px_5px_#8eb990,-2px_-2px_5px_#ffffff] flex items-center justify-center text-[#1B5E20]">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-[#2E7D32] serif">Clay</h2>
                        <p class="text-xs text-[#2E7D32]/70">Solid & Tactile</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-[#A5D6A7] flex items-center justify-center text-[#1B5E20] text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

             <!-- Resin -->
             <div onclick="notify('resin')" class="style-resin p-4 flex items-center justify-between relative overflow-hidden active:scale-95 transition-transform cursor-pointer">
                <div class="absolute inset-0 bg-white/10 blur-xl"></div>
                <div class="flex items-center gap-4 relative z-10">
                    <div class="w-12 h-12 rounded-full bg-purple-200/50 backdrop-blur-sm border border-white/60 flex items-center justify-center text-purple-700">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-purple-700 serif">Gummy</h2>
                        <p class="text-xs text-purple-700/70">Hybrid Pop</p>
                    </div>
                </div>
                <div class="relative z-10 w-8 h-8 rounded-full bg-purple-300/50 flex items-center justify-center text-purple-700 text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>
        </div>
        
        <!-- Space for notifications -->
        <div class="h-24 w-full"></div>
    </div>

    <!-- Notification Container -->
    <div id="notifications" class="notification-area"></div>

    <script>
        // --- 1. DETECT IF IN "APP" MODE ---
        // This is the logic that decides if we are fullscreen or not.
        function checkMode() {
            // Check iOS Standalone
            const isIOSApp = window.navigator.standalone === true;
            // Check Android Standalone
            const isAndroidApp = window.matchMedia('(display-mode: standalone)').matches;

            // If it is NOT an app (meaning it's in the browser), show the instructions
            if (!isIOSApp && !isAndroidApp) {
                document.getElementById('install-prompt').style.display = 'flex';
            }
            // If it IS an app, the browser will automatically hide bars because of our Meta Tags.
            // We don't need to do anything else! It is "Auto Fullscreen".
        }
        
        // Run check immediately
        checkMode();


        // --- 2. NOTIFICATION LOGIC ---
        const container = document.getElementById('notifications');
        const content = {
            plush: { title: "Liked", msg: "Softest like ever.", icon: "fa-heart" },
            glass: { title: "Airdrop", msg: "photo_01.jpg", icon: "fa-wifi" },
            clay: { title: "Done", msg: "Task completed.", icon: "fa-check" },
            resin: { title: "Reminder", msg: "Pilates at 4:00 PM", icon: "fa-bell" }
        };

        function notify(type) {
            if (navigator.vibrate) navigator.vibrate(10);

            const data = content[type];
            const el = document.createElement('div');
            el.className = `notification-item`;
            
            if (type === 'plush') {
                el.style.animation = "bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards";
                el.innerHTML = `
                    <div class="style-plush p-4 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-[#FFD6E0] shadow-inner flex items-center justify-center text-[#8C5E69]"><i class="fa-solid ${data.icon}"></i></div>
                        <div><h4 class="serif font-bold text-[#8C5E69]">${data.title}</h4><p class="text-xs text-[#8C5E69]/70 font-bold">${data.msg}</p></div>
                    </div>`;
            } else if (type === 'glass') {
                el.style.animation = "slideFloat 0.5s ease-out forwards";
                el.innerHTML = `
                    <div class="style-glass p-4 flex items-center justify-between backdrop-blur-md">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-lg border border-white/40 bg-white/20 flex items-center justify-center text-slate-600"><i class="fa-solid ${data.icon}"></i></div>
                            <div><h4 class="serif italic text-slate-700 text-lg">${data.title}</h4><p class="text-xs text-slate-500 font-mono">${data.msg}</p></div>
                        </div>
                    </div>`;
            } else if (type === 'clay') {
                el.style.animation = "bounceIn 0.4s ease-out forwards";
                el.innerHTML = `
                    <div class="style-clay p-3 flex items-center gap-3 pr-6">
                        <div class="w-10 h-10 rounded-full bg-[#A5D6A7] shadow-[2px_2px_5px_#8eb990,-2px_-2px_5px_#ffffff] flex items-center justify-center text-white"><i class="fa-solid ${data.icon}"></i></div>
                        <div class="flex-1 bg-[#E8F5E9] shadow-inner rounded-full px-4 py-2"><h4 class="font-bold text-[#2E7D32] text-xs uppercase tracking-wider">${data.title}</h4><p class="text-xs text-[#2E7D32]/70">${data.msg}</p></div>
                    </div>`;
            } else if (type === 'resin') {
                el.style.animation = "bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards";
                el.innerHTML = `
                    <div class="style-resin p-3 flex items-center gap-3 pr-4 backdrop-blur-xl">
                        <div class="w-12 h-12 rounded-full bg-purple-100/40 border border-white/60 flex items-center justify-center text-purple-600 shadow-sm backdrop-blur-sm"><i class="fa-solid ${data.icon}"></i></div>
                        <div class="resin-inset flex-1 px-4 py-2 flex justify-between items-center">
                            <div><h4 class="serif italic font-bold text-purple-800 text-lg leading-tight">${data.title}</h4><p class="text-xs text-purple-700/80 font-medium">${data.msg}</p></div>
                            <button onclick="event.stopPropagation(); this.closest('.notification-item').remove()" class="text-purple-400 hover:text-purple-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>`;
            }

            container.appendChild(el);
            el.onclick = () => {
                el.style.transition = "all 0.3s ease"; el.style.opacity = '0'; el.style.transform = 'scale(0.8)';
                setTimeout(() => el.remove(), 300);
            };
            setTimeout(() => {
                if(el.parentNode) {
                    el.style.transition = "all 0.5s ease"; el.style.opacity = '0'; el.style.transform = 'translateY(10px)';
                    setTimeout(() => { if(el.parentNode) el.remove() }, 500);
                }
            }, 4000);
        }
    </script>
</body>
</html>
