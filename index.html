    <!-- Store Lua Code Safely away from JS Minifiers (like OneCompiler's) -->
    <script id="framework-lua" type="text/plain">
local js = require "js"
local window = js.global
local document = window.document
local previewArea = document:getElementById("ui-center-anchor")

_G.print = function(...)
    local args = {...}
    local str = ""
    for i, v in ipairs(args) do str = str .. tostring(v) .. "  " end
    window:uiPrint(str)
end

_G.warn = function(...)
    local args = {...}
    local str = ""
    for i, v in ipairs(args) do str = str .. tostring(v) .. "  " end
    window:uiWarn(str)
end

_G.clearUI = function()
    previewArea.innerHTML = ""
end

local function parseCoord(c, defW, defH)
    if type(c) == "table" then 
        return (c[1] or defW).."px", (c[2] or defH).."px" 
    elseif type(c) == "number" then
        return c.."px", c.."px"
    end
    return defW.."px", defH.."px"
end

local function parseColor(c, defColor)
    if type(c) == "table" then 
        local r = math.floor(tonumber(c[1]) or 255)
        local g = math.floor(tonumber(c[2]) or 255)
        local b = math.floor(tonumber(c[3]) or 255)
        local a = tonumber(c[4]) or 1
        return "rgba("..r..","..g..","..b..","..a..")" 
    end
    if type(c) == "string" then return c end
    return defColor or "transparent"
end

local function makeDraggable(el) window:makeElementDraggable(el) end

-- Helper to add shared methods (blur, hide, show, hover) to all components
local function addSharedMethods(obj, el)
    local initialDisplay = el.style.display
    function obj:setVisible(visible)
        if visible == false then
            el.style.display = "none"
        else
            el.style.display = initialDisplay
        end
    end
    function obj:hide() self:setVisible(false) end
    function obj:show() self:setVisible(true) end
    
    function obj:setBlur(radius)
        local r = tonumber(radius) or 0
        el.style.backdropFilter = "blur(" .. r .. "px)"
        el.style.webkitBackdropFilter = "blur(" .. r .. "px)"
    end
    
    local hoverEnabled = false
    function obj:setHoverEffect(enabled)
        hoverEnabled = enabled and true or false
        if hoverEnabled then
            el.style.transition = "transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), filter 0.15s"
            if el.tagName ~= "BUTTON" then el.style.cursor = "pointer" end
        else
            el.style.transition = "none"
            el.style.transform = "translate(-50%, 50%) scale(1)"
            el.style.filter = "brightness(1)"
            if el.tagName ~= "BUTTON" then el.style.cursor = "default" end
        end
    end
    
    el:addEventListener("mousedown", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(0.95)" end end)
    el:addEventListener("mouseup", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(1.05)" end end)
    el:addEventListener("mouseleave", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.filter = "brightness(1)" end end)
    el:addEventListener("mouseenter", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(1.05)"; el.style.filter = "brightness(1.15)" end end)
end

local function addTextMethods(obj, el, textSpan)
    function obj:setText(newText) textSpan.innerText = newText end
    function obj:setTextPlacement(centered, offsets)
        el.style.justifyContent = "center"
        el.style.alignItems = "center"
        if centered then
            textSpan.style.transform = "translate(0px, 0px)"
        else
            local ox, oy = 0, 0
            if type(offsets) == "table" then
                ox = offsets[1] or 0
                oy = offsets[2] or 0
            end
            if type(oy) == "number" then oy = -oy end
            if type(ox) == "number" then ox = ox .. "px" end
            if type(oy) == "number" then oy = oy .. "px" end
            textSpan.style.transform = "translate(" .. ox .. ", " .. oy .. ")"
        end
    end
end

-- ==========================================
-- Frame
-- ==========================================
_G.frame = {}
function _G.frame.new(size, pos, color, radius, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 100)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.backgroundColor = parseColor(color, "transparent")
    el.style.borderRadius = (radius or 0).."px"
    el.style.zIndex = tostring(layer or 1)
    previewArea:appendChild(el)
    local obj = { element = el }
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el)
    return obj
end

-- ==========================================
-- Image Frame
-- ==========================================
_G.imageframe = {}
function _G.imageframe.new(size, pos, url, radius, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 100)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.borderRadius = (radius or 0).."px"
    el.style.zIndex = tostring(layer or 1)
    el.style.backgroundColor = "transparent"
    el.style.backgroundSize = "cover"
    el.style.backgroundPosition = "center"
    el.style.backgroundRepeat = "no-repeat"
    if url then el.style.backgroundImage = "url('"..url.."')" end
    previewArea:appendChild(el)
    local obj = { element = el }
    function obj:setSource(newUrl) el.style.backgroundImage = "url('"..newUrl.."')" end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el)
    return obj
end

-- ==========================================
-- Button
-- ==========================================
_G.btn = {}
function _G.btn.new(size, pos, color, radius, text, textColor, layer)
    local el = document:createElement("button")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 50)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.backgroundColor = parseColor(color, "#313244")
    el.style.borderRadius = (radius or 0).."px"
    el.style.zIndex = tostring(layer or 1)
    el.style.overflow = "hidden"
    
    local fillBar = document:createElement("div")
    fillBar.style.position = "absolute"
    fillBar.style.left = "0"; fillBar.style.top = "0"; fillBar.style.bottom = "0"
    fillBar.style.width = "0%"; fillBar.style.backgroundColor = "rgba(255, 255, 255, 0.25)"
    fillBar.style.pointerEvents = "none"
    el:appendChild(fillBar)
    
    local textSpan = document:createElement("span")
    textSpan.innerText = text or ""
    textSpan.style.pointerEvents = "none"
    textSpan.style.position = "relative"; textSpan.style.zIndex = "10"
    el:appendChild(textSpan)
    
    el.style.border = "none"; el.style.cursor = "pointer"
    el.style.color = parseColor(textColor, "#ffffff"); el.style.fontFamily = "sans-serif"
    el.style.fontWeight = "bold"; el.style.display = "flex"
    el.style.alignItems = "center"; el.style.justifyContent = "center"
    el.style.boxShadow = "0 4px 6px -1px rgba(0,0,0,0.1)"
    
    local obj = { element = el, callbacks = {} }
    local holdEnabled = false
    local showHoldBar = true
    local holdDuration = 1000
    local holdTimer = nil
    
    local function clearHold()
        if holdTimer then window:clearTimeout(holdTimer); holdTimer = nil end
        fillBar.style.transition = "none"
        fillBar.style.width = "0%"
    end

    el:addEventListener("mousedown", function() 
        if holdEnabled then
            if showHoldBar then
                fillBar.style.transition = "width " .. holdDuration .. "ms linear"
                fillBar.style.width = "100%"
            end
            holdTimer = window:setTimeout(function()
                holdTimer = nil
                if showHoldBar then
                    fillBar.style.transition = "opacity 0.2s"
                    fillBar.style.opacity = "0"
                    window:setTimeout(function()
                        fillBar.style.transition = "none"
                        fillBar.style.width = "0%"
                        fillBar.style.opacity = "1"
                    end, 200)
                end
                for i, cb in ipairs(obj.callbacks) do cb() end
            end, holdDuration)
        end
    end)
    el:addEventListener("mouseup", function() clearHold() end)
    el:addEventListener("mouseleave", function() clearHold() end)
    el:addEventListener("click", function() if not holdEnabled then for i, cb in ipairs(obj.callbacks) do cb() end end end)

    previewArea:appendChild(el)
    function obj:onClick(cb) table.insert(obj.callbacks, cb) end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    
    function obj:setHold(enabled, duration, showBar)
        holdEnabled = enabled and true or false
        if type(duration) == "number" then holdDuration = duration * 1000 end
        showHoldBar = (showBar == nil) and true or (showBar and true or false)
    end
    
    addTextMethods(obj, el, textSpan)
    addSharedMethods(obj, el)
    obj:setHoverEffect(true) 
    return obj
end

-- ==========================================
-- Label
-- ==========================================
_G.label = {}
function _G.label.new(size, pos, text, textColor, textSize, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 30)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.color = parseColor(textColor, "#ffffff")
    el.style.fontSize = (textSize or 14).."px"
    el.style.zIndex = tostring(layer or 1)
    local textSpan = document:createElement("span")
    textSpan.innerText = text or "Label"
    el:appendChild(textSpan)
    el.style.fontFamily = "sans-serif"; el.style.display = "flex"
    el.style.alignItems = "center"; el.style.justifyContent = "center"
    previewArea:appendChild(el)
    local obj = { element = el }
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addTextMethods(obj, el, textSpan)
    addSharedMethods(obj, el)
    return obj
end

-- ==========================================
-- Text Input
-- ==========================================
_G.input = {}
function _G.input.new(size, pos, placeholder, bgColor, textColor, radius, layer)
    local el = document:createElement("input")
    el.type = "text"; el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 40)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.placeholder = placeholder or "Enter text..."
    el.style.backgroundColor = parseColor(bgColor, "#11111b")
    el.style.color = parseColor(textColor, "#cdd6f4")
    el.style.borderRadius = (radius or 4).."px"
    el.style.zIndex = tostring(layer or 1)
    el.style.border = "1px solid #313244"; el.style.padding = "0 10px"
    el.style.outline = "none"; el.style.fontFamily = "sans-serif"
    el:addEventListener("focus", function() el.style.borderColor = "#89b4fa" end)
    el:addEventListener("blur", function() el.style.borderColor = "#313244" end)
    previewArea:appendChild(el)
    local obj = { element = el }
    function obj:getText() return el.value end
    function obj:setText(t) el.value = t end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el)
    return obj
end

-- ==========================================
-- Progress Bar
-- ==========================================
_G.progressbar = {}
function _G.progressbar.new(size, pos, bgColor, fillValue, fillColor, radius, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 200, 20)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.backgroundColor = parseColor(bgColor, "#11111b")
    el.style.borderRadius = (radius or 8).."px"
    el.style.overflow = "hidden"; el.style.zIndex = tostring(layer or 1)
    local fillEl = document:createElement("div")
    fillEl.style.height = "100%"; fillEl.style.backgroundColor = parseColor(fillColor, "#a6e3a1")
    local pct = (tonumber(fillValue) or 0) * 100
    fillEl.style.width = math.max(0, math.min(100, pct)) .. "%"
    fillEl.style.transition = "width 0.3s ease"
    el:appendChild(fillEl)
    previewArea:appendChild(el)
    local obj = { element = el, fillEl = fillEl }
    function obj:setValue(val) 
        local v = (tonumber(val) or 0) * 100
        fillEl.style.width = math.max(0, math.min(100, v)) .. "%" 
    end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el)
    return obj
end

-- ==========================================
-- Toggle Switch
-- ==========================================
_G.toggle = {}
function _G.toggle.new(size, pos, activeColor, inactiveColor, startState, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 50, 26)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.borderRadius = "999px"; el.style.cursor = "pointer"
    el.style.zIndex = tostring(layer or 1); el.style.transition = "background-color 0.3s"
    local ac = parseColor(activeColor, "#a6e3a1")
    local ic = parseColor(inactiveColor, "#45475a")
    local state = startState and true or false
    el.style.backgroundColor = state and ac or ic
    local hNum = tonumber(string.match(h, "%d+")) or 26
    local wNum = tonumber(string.match(w, "%d+")) or 50
    local knobSize = (hNum - 4) .. "px"
    local knobRight = (wNum - hNum + 2) .. "px"
    local knob = document:createElement("div")
    knob.style.position = "absolute"; knob.style.top = "2px"
    knob.style.width = knobSize; knob.style.height = knobSize
    knob.style.backgroundColor = "#ffffff"; knob.style.borderRadius = "50%"
    knob.style.transition = "left 0.3s"; knob.style.left = state and knobRight or "2px"
    knob.style.boxShadow = "0 1px 3px rgba(0,0,0,0.3)"
    el:appendChild(knob)
    previewArea:appendChild(el)
    local obj = { element = el, state = state, callbacks = {} }
    el:addEventListener("click", function()
        obj.state = not obj.state
        el.style.backgroundColor = obj.state and ac or ic
        knob.style.left = obj.state and knobRight or "2px"
        for i, cb in ipairs(obj.callbacks) do cb(obj.state) end
    end)
    function obj:onChange(cb) table.insert(obj.callbacks, cb) end
    function obj:getState() return self.state end
    function obj:setState(s)
        self.state = s and true or false
        el.style.backgroundColor = self.state and ac or ic
        knob.style.left = self.state and knobRight or "2px"
    end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el)
    return obj
end

-- ==========================================
-- Dropdown Menu
-- ==========================================
_G.dropdown = {}
function _G.dropdown.new(size, pos, options, bgColor, textColor, radius, layer)
    local el = document:createElement("select")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 40)
    el.style.width = w; el.style.height = h
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.backgroundColor = parseColor(bgColor, "#181825")
    el.style.color = parseColor(textColor, "#cdd6f4")
    el.style.borderRadius = (radius or 4).."px"
    el.style.zIndex = tostring(layer or 1); el.style.border = "1px solid #313244"
    el.style.padding = "0 10px"; el.style.outline = "none"
    el.style.fontFamily = "sans-serif"; el.style.cursor = "pointer"
    if type(options) == "table" then
        for i, opt in ipairs(options) do
            local optionEl = document:createElement("option")
            optionEl.value = tostring(opt); optionEl.innerText = tostring(opt)
            el:appendChild(optionEl)
        end
    end
    previewArea:appendChild(el)
    local obj = { element = el, callbacks = {} }
    el:addEventListener("change", function() for i, cb in ipairs(obj.callbacks) do cb(el.value) end end)
    function obj:onSelect(cb) table.insert(obj.callbacks, cb) end
    function obj:getValue() return el.value end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el)
    return obj
end
    </script>

    <script id="default-lua" type="text/plain">
clearUI()

print("Origin (0,0) is Center. Added configurable Hold animations!")

-- 1. Create a "Confirmation" button WITH the loading bar
local dangerousBtn = btn.new({200, 45}, {0, 60}, "#f38ba8", 8, "Long Press (With Bar)", "#11111b", 2)
dangerousBtn:setHold(true, 3, true) -- Enabled, 3 seconds, SHOW bar

dangerousBtn:onClick(function()
    print("Confirmed! (Visual bar shown)")
end)

-- 2. Create a button that requires a hold but has NO bar (stealthy hold)
local stealthBtn = btn.new({200, 45}, {0, -10}, "#89b4fa", 8, "Long Press (No Bar)", "#11111b", 2)
stealthBtn:setHold(true, 1.5, false) -- Enabled, 1.5 seconds, HIDE bar

stealthBtn:onClick(function()
    print("Triggered stealthily! (No visual bar was shown)")
end)

-- 3. A normal button (no hold required)
local normalBtn = btn.new({200, 45}, {0, -80}, "#a6e3a1", 8, "Normal Click", "#11111b", 2)
normalBtn:onClick(function()
    print("Normal click triggered instantly.")
end)
    </script>

                        x: 0, y: 0 (Center Origin)
                    </div>
                    <button onclick="togglePreviewFullscreen()" class="p-1.5 bg-[#313244] hover:bg-[#45475a] text-[#cdd6f4] rounded-md transition-colors" title="Fullscreen Preview">
                        <i class="ph-bold ph-corners-out text-sm"></i>
                    </button>
                </div>
            </div>
            <div class="flex-1 relative overflow-hidden preview-bg" id="ui-preview" style="perspective: 1000px;">
                <div id="ui-center-anchor" class="absolute left-1/2 bottom-1/2 w-0 h-0 overflow-visible"></div>
            </div>
            <div id="console-container" class="h-2/5 flex flex-col bg-[#11111b]">
                <div class="h-9 bg-[#181825] flex items-center px-4 text-xs font-medium text-[#bac2de] border-b border-[#313244] shrink-0 gap-2">
                    <i class="ph-bold ph-terminal text-[#f38ba8]"></i> Output Console
                </div>
                <div id="console-output" class="flex-1 overflow-y-auto p-3 text-[13px] font-mono text-[#a6adc8] space-y-1 select-text">
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('fullscreen-overlay');
            const btnFullscreen = document.getElementById('btn-enter-fullscreen');
            const btnWindowed = document.getElementById('btn-enter-windowed');
            
            btnFullscreen.addEventListener('click', () => {
                document.documentElement.requestFullscreen().catch(err => console.warn(err));
                overlay.classList.add('hidden');
            });

            btnWindowed.addEventListener('click', () => overlay.classList.add('hidden'));
        });

        function togglePreviewFullscreen() {
            const preview = document.getElementById('ui-preview');
            if (document.fullscreenElement === preview) {
                document.exitFullscreen();
            } else {
                preview.requestFullscreen().catch(err => console.warn(err));
            }
        }

        window.makeElementDraggable = function(el) {
            let isDragging = false;
            let startX, startY, initialX, initialY;
            let animationFrameId = null;
            const updatePosition = (clientX, clientY) => {
                const dx = clientX - startX;
                const dy = startY - clientY;
                el.style.left = (initialX + dx) + "px";
                el.style.bottom = (initialY + dy) + "px";
            };
            const onMouseMove = (e) => {
                if (!isDragging) return;
                const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
                const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(() => updatePosition(clientX, clientY));
            };
            const onMouseUp = () => {
                isDragging = false;
                document.removeEventListener("mousemove", onMouseMove);
                document.removeEventListener("mouseup", onMouseUp);
            };
            const onMouseDown = (e) => {
                if (['INPUT', 'TEXTAREA', 'SELECT', 'OPTION'].includes(e.target.tagName)) return;
                isDragging = true;
                startX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
                startY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
                initialX = parseFloat(el.style.left) || 0;
                initialY = parseFloat(el.style.bottom) || 0;
                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);
            };
            el.addEventListener("mousedown", onMouseDown);
        };

        let editor;
        let frameworkLoaded = false;

        const paramSignatures = {
            'frame.new': ['size: {w, h}', 'pos: {x, y}', 'color: "#hex"|{r,g,b,a}', 'radius: number', 'layer: number'],
            'btn.new': ['size: {w, h}', 'pos: {x, y}', 'color: "#hex"|{r,g,b,a}', 'radius: number', 'text: string', 'textColor: string', 'layer: number'],
            'label.new': ['size: {w, h}', 'pos: {x, y}', 'text: string', 'textColor: string', 'textSize: number', 'layer: number'],
            'input.new': ['size: {w, h}', 'pos: {x, y}', 'placeholder: string', 'bgColor: string', 'textColor: string', 'radius: number', 'layer: number'],
            'imageframe.new': ['size: {w, h}', 'pos: {x, y}', 'url: string', 'radius: number', 'layer: number'],
            'progressbar.new': ['size: {w, h}', 'pos: {x, y}', 'bgColor: string', 'fillValue: 0-1', 'fillColor: string', 'radius: number', 'layer: number'],
            'toggle.new': ['size: {w, h}', 'pos: {x, y}', 'activeColor: string', 'inactiveColor: string', 'startState: boolean', 'layer: number'],
            'dropdown.new': ['size: {w, h}', 'pos: {x, y}', 'options: {"a", "b"}', 'bgColor: string', 'textColor: string', 'radius: number', 'layer: number'],
            ':setTextPlacement': ['centered: boolean', 'offsets: {x, y}'],
            ':setHold': ['enabled: boolean', 'duration: seconds', 'showBar: boolean'],
            ':setVisible': ['visible: boolean'],
            ':setBlur': ['radius: pixels'],
            ':setHoverEffect': ['enabled: boolean'],
            ':hide': [],
            ':show': [],
            ':setDraggable': ['draggable: boolean'],
            ':setValue': ['value: 0-1'],
            ':setSource': ['url: string'],
            ':setText': ['text: string'],
            ':onClick': ['callback: function()'],
            ':onChange': ['callback: function(state)'],
            ':onSelect': ['callback: function(value)'],
            ':getText': [],
            ':getState': [],
            ':setState': ['state: boolean'],
            ':getValue': [],
            'clearUI': [],
            'print': ['...'],
            'warn': ['...']
        };

        document.addEventListener("DOMContentLoaded", () => {
            editor = ace.edit("editor");
            editor.setTheme("ace/theme/tomorrow_night_eighties");
            editor.session.setMode("ace/mode/lua");
            editor.setOptions({
                fontFamily: "ui-monospace, SFMono-Regular, Consolas, monospace",
                fontSize: "14px",
                showPrintMargin: false,
                enableBasicAutocompletion: true,
                enableLiveAutocompletion: true,
                tabSize: 4,
                useSoftTabs: true
            });
            const defaultScriptRaw = document.getElementById('default-lua').textContent.trim();
            editor.setValue(defaultScriptRaw, -1);
            editor.clearSelection(); 
            editor.commands.addCommand({
                name: 'runScript',
                bindKey: {win: 'F5|Ctrl-Enter',  mac: 'F5|Command-Enter'},
                exec: function() { runScript(); }
            });

            const tooltipEl = document.getElementById('param-tooltip');
            editor.on("mousemove", function (e) {
                const pos = e.getDocumentPosition();
                const line = editor.session.getLine(pos.row);
                const beforeCursor = line.substring(0, pos.column);
                let depth = 0; let foundOpenParen = false; let openParenIndex = -1;
                let inString = false; let stringChar = '';
                for (let i = beforeCursor.length - 1; i >= 0; i--) {
                    let char = beforeCursor[i];
                    if (char === '"' || char === "'") {
                        if (!inString) { inString = true; stringChar = char; }
                        else if (char === stringChar && beforeCursor[i-1] !== '\\') inString = false;
                        continue;
                    }
                    if (inString) continue;
                    if (char === ')') depth++;
                    else if (char === '(') {
                        if (depth === 0) { foundOpenParen = true; openParenIndex = i; break; }
                        else depth--;
                    }
                }
                if (foundOpenParen) {
                    let funcMatch = beforeCursor.substring(0, openParenIndex).match(/([a-zA-Z0-9_]+(?:\.[a-zA-Z0-9_]+)?|:[a-zA-Z0-9_]+)\s*$/);
                    if (funcMatch) {
                        let type = funcMatch[1];
                        let argIndex = 0; let forwardDepth = 0; let fInString = false; let fStringChar = '';
                        for (let i = openParenIndex + 1; i < beforeCursor.length; i++) {
                            let char = beforeCursor[i];
                            if (fInString) { if (char === fStringChar && beforeCursor[i-1] !== '\\') fInString = false; }
                            else {
                                if (char === '"' || char === "'") { fInString = true; fStringChar = char; }
                                else if (char === '(' || char === '{') forwardDepth++;
                                else if (char === ')' || char === '}') forwardDepth--;
                                else if (char === ',' && forwardDepth === 0) argIndex++;
                            }
                        }
                        const sigArray = paramSignatures[type];
                        if (sigArray && sigArray.length > 0) {
                            let html = `<span class="text-[#89b4fa]">${type}</span>( `;
                            for(let i = 0; i < sigArray.length; i++){
                                let shortName = sigArray[i].split(':')[0];
                                if(i === argIndex) html += `<span class="text-[#a6e3a1] font-bold px-1 bg-[#a6e3a1]/20 rounded border border-[#a6e3a1]/30">${sigArray[i]}</span>`;
                                else html += `<span class="text-[#a6adc8]">${shortName}</span>`;
                                if(i < sigArray.length-1) html += '<span class="text-[#6c7086]">, </span>';
                            }
                            html += ' )';
                            tooltipEl.innerHTML = html;
                            tooltipEl.style.left = (e.domEvent.clientX + 15) + 'px';
                            tooltipEl.style.top = (e.domEvent.clientY + 15) + 'px';
                            tooltipEl.classList.remove('hidden');
                            return;
                        } else if (sigArray && sigArray.length === 0) {
                             tooltipEl.innerHTML = `<span class="text-[#89b4fa]">${type}</span>()`;
                             tooltipEl.style.left = (e.domEvent.clientX + 15) + 'px';
                             tooltipEl.style.top = (e.domEvent.clientY + 15) + 'px';
                             tooltipEl.classList.remove('hidden');
                             return;
                        }
                    }
                }
                tooltipEl.classList.add('hidden');
            });
            uiPrint("Environment ready. Origin is center (0,0).", "text-[#89b4fa]");
            setTimeout(runScript, 300);
        });

        function formatCode() {
            let code = editor.getValue();
            let lines = code.split('\n');
            let indent = 0;
            let out = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) { out.push(''); continue; }
                if (line.match(/^(end|elseif|else|until)\b/) || line.match(/^}/)) indent = Math.max(0, indent - 1);
                out.push('    '.repeat(indent) + line);
                if (line.match(/\bthen\b\s*(--.*)?$/) || line.match(/\bdo\b\s*(--.*)?$/) || line.match(/\bfunction.*[^{]\s*(--.*)?$/) || line.match(/^else\b/) || line.match(/^elseif\b/) || line.match(/\brepeat\b\s*(--.*)?$/) || line.match(/{\s*(--.*)?$/)) indent++;
            }
            editor.setValue(out.join('\n'), -1);
        }

        function clearComments() {
            let code = editor.getValue();
            let out = ""; let inString = false; let stringChar = '';
            for (let i = 0; i < code.length; i++) {
                if (inString) {
                    out += code[i];
                    if (code[i] === '\\') { i++; if (i < code.length) out += code[i]; }
                    else if (code[i] === stringChar) inString = false;
                } else {
                    if (code[i] === '"' || code[i] === "'") { inString = true; stringChar = code[i]; out += code[i]; }
                    else if (code.substring(i, i + 4) === '--[[') {
                        let endIdx = code.indexOf(']]', i + 4);
                        if (endIdx === -1) endIdx = code.length; else endIdx += 2;
                        let start = i; let removeBefore = 0;
                        while (start - removeBefore - 1 >= 0 && (code[start - removeBefore - 1] === ' ' || code[start - removeBefore - 1] === '\t')) removeBefore++;
                        let isStartOfLine = (start - removeBefore === 0 || code[start - removeBefore - 1] === '\n');
                        let removeAfter = 0;
                        if (code[endIdx] === '\r') removeAfter++; if (code[endIdx + removeAfter] === '\n') removeAfter++;
                        let isEndOfLine = (removeAfter > 0 || endIdx === code.length);
                        if (isStartOfLine && isEndOfLine) { out = out.substring(0, out.length - removeBefore); i = endIdx + removeAfter - 1; }
                        else { out = out.substring(0, out.length - removeBefore); i = endIdx - 1; }
                    } else if (code.substring(i, i + 2) === '--') {
                        let endIdx = code.indexOf('\n', i + 2);
                        if (endIdx === -1) endIdx = code.length;
                        let start = i; let removeBefore = 0;
                        while (start - removeBefore - 1 >= 0 && (code[start - removeBefore - 1] === ' ' || code[start - removeBefore - 1] === '\t')) removeBefore++;
                        let isStartOfLine = (start - removeBefore === 0 || code[start - removeBefore - 1] === '\n');
                        if (isStartOfLine) { out = out.substring(0, out.length - removeBefore); i = endIdx; }
                        else { out = out.substring(0, out.length - removeBefore); i = endIdx - 1; }
                    } else out += code[i];
                }
            }
            editor.setValue(out, -1);
        }

        function copyCode() {
            navigator.clipboard.writeText(editor.getValue());
            uiPrint("Code copied!", "text-[#a6e3a1]");
        }

        function runScript() {
            const btn = document.getElementById('btnPlay');
            btn.classList.add('opacity-80');
            setTimeout(() => {
                const code = editor.getValue();
                try {
                    if (!frameworkLoaded) {
                        const frameworkSetupLua = document.getElementById('framework-lua').textContent;
                        fengari.load(frameworkSetupLua)();
                        frameworkLoaded = true;
                    }
                    fengari.load(code, "main.lua")();
                } catch(err) {
                    uiError(err.toString());
                }
                btn.classList.remove('opacity-80');
            }, 50);
        }

        window.uiPrint = function(msg, customClass = "text-[#cdd6f4]") { appendLog(msg, customClass); }
        window.uiWarn = function(msg) { appendLog(`[WARN] ${msg}`, "text-[#f9e2af] bg-[#f9e2af]/10 border-l-2 border-[#f9e2af] pl-2"); }
        function uiError(msg) { appendLog(`[ERROR] ${msg}`, "text-[#f38ba8] bg-[#f38ba8]/10 border-l-2 border-[#f38ba8] pl-2 font-semibold"); }
        function appendLog(msg, classes) {
            const consoleDiv = document.getElementById('console-output');
            const line = document.createElement('div');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            line.innerHTML = `<span class="text-[#6c7086] mr-2">[${timeStr}]</span> <span>${msg}</span>`;
            line.className = `py-1 border-b border-[#313244]/50 hover:bg-[#313244]/30 ${classes}`;
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        function clearConsole() { document.getElementById('console-output').innerHTML = ''; }
    </script>
</body>
</html>
