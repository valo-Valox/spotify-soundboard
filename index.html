    <!-- Store Lua Code Safely away from JS Minifiers (like OneCompiler's) -->
    <script id="framework-lua" type="text/plain">
local js = require "js"
local window = js.global
local document = window.document
local previewArea = document:getElementById("ui-preview")

_G.print = function(...)
    local args = {...}
    local str = ""
    for i, v in ipairs(args) do str = str .. tostring(v) .. "  " end
    window:uiPrint(str)
end

_G.warn = function(...)
    local args = {...}
    local str = ""
    for i, v in ipairs(args) do str = str .. tostring(v) .. "  " end
    window:uiWarn(str)
end

_G.clearUI = function()
    previewArea.innerHTML = ""
end

local function parseCoord(c, defW, defH)
    if type(c) == "table" then 
        return (c[1] or defW).."px", (c[2] or defH).."px" 
    elseif type(c) == "number" then
        return c.."px", c.."px"
    end
    return defW.."px", defH.."px"
end

local function parseColor(c, defColor)
    if type(c) == "table" then 
        local r = math.floor(tonumber(c[1]) or 255)
        local g = math.floor(tonumber(c[2]) or 255)
        local b = math.floor(tonumber(c[3]) or 255)
        local a = tonumber(c[4]) or 1
        return "rgba("..r..","..g..","..b..","..a..")" 
    end
    if type(c) == "string" then return c end
    return defColor or "transparent"
end

local function makeDraggable(el) window:makeElementDraggable(el) end

-- Helper to add .hide() / .show() / .setVisible() to all components
local function addVisibilityMethods(obj, el)
    local initialDisplay = el.style.display
    function obj:setVisible(visible)
        if visible == false then
            el.style.display = "none"
        else
            el.style.display = initialDisplay
        end
    end
    function obj:hide() self:setVisible(false) end
    function obj:show() self:setVisible(true) end
end

local function addTextMethods(obj, el, textSpan)
    function obj:setText(newText) textSpan.innerText = newText end
    function obj:setTextPlacement(centered, offsets)
        el.style.justifyContent = "center"
        el.style.alignItems = "center"
        if centered then
            textSpan.style.translate = "0px 0px"
        else
            local ox, oy = 0, 0
            if type(offsets) == "table" then
                ox = offsets[1] or 0
                oy = offsets[2] or 0
            end
            
            -- Invert Y for offsets so Positive means UP (matching component origin coords)
            if type(oy) == "number" then oy = -oy end
            
            if type(ox) == "number" then ox = ox .. "px" end
            if type(oy) == "number" then oy = oy .. "px" end
            textSpan.style.translate = ox .. " " .. oy
        end
    end
end

-- ==========================================
-- Frame
-- ==========================================
_G.frame = {}
function _G.frame.new(size, pos, color, radius, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 100)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.style.backgroundColor = parseColor(color, "transparent")
    el.style.borderRadius = (radius or 0).."px"
    el.style.zIndex = tostring(layer or 1)
    previewArea:appendChild(el)
    local obj = { element = el }
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addVisibilityMethods(obj, el)
    return obj
end

-- ==========================================
-- Image Frame
-- ==========================================
_G.imageframe = {}
function _G.imageframe.new(size, pos, url, radius, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 100)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.style.borderRadius = (radius or 0).."px"
    el.style.zIndex = tostring(layer or 1)
    el.style.backgroundColor = "transparent"
    el.style.backgroundSize = "cover"
    el.style.backgroundPosition = "center"
    el.style.backgroundRepeat = "no-repeat"
    if url then el.style.backgroundImage = "url('"..url.."')" end
    previewArea:appendChild(el)
    
    local obj = { element = el }
    function obj:setSource(newUrl) el.style.backgroundImage = "url('"..newUrl.."')" end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addVisibilityMethods(obj, el)
    return obj
end

-- ==========================================
-- Button
-- ==========================================
_G.btn = {}
function _G.btn.new(size, pos, color, radius, text, textColor, layer)
    local el = document:createElement("button")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 50)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.style.backgroundColor = parseColor(color, "#313244")
    el.style.borderRadius = (radius or 0).."px"
    el.style.zIndex = tostring(layer or 1)
    
    local textSpan = document:createElement("span")
    textSpan.innerText = text or ""
    textSpan.style.pointerEvents = "none"
    el:appendChild(textSpan)
    
    el.style.border = "none"; el.style.cursor = "pointer"
    el.style.color = parseColor(textColor, "#ffffff"); el.style.fontFamily = "sans-serif"
    el.style.fontWeight = "bold"; el.style.display = "flex"
    el.style.alignItems = "center"; el.style.justifyContent = "center"
    el.style.boxShadow = "0 4px 6px -1px rgba(0,0,0,0.1)"
    el.style.transition = "scale 0.1s, filter 0.1s" -- Replaced transform with modern scale property
    
    local obj = { element = el, callbacks = {} }
    local holdEnabled = false
    local holdDuration = 1000
    local holdTimer = nil
    
    local function clearHold()
        if holdTimer then
            window:clearTimeout(holdTimer)
            holdTimer = nil
        end
        el.style.scale = "1"
    end

    el:addEventListener("mousedown", function() 
        el.style.scale = "0.95" 
        if holdEnabled then
            holdTimer = window:setTimeout(function()
                holdTimer = nil
                el.style.scale = "1" 
                for i, cb in ipairs(obj.callbacks) do cb() end
            end, holdDuration)
        end
    end)
    el:addEventListener("mouseup", function() clearHold() end)
    el:addEventListener("mouseleave", function() 
        clearHold()
        el.style.filter = "brightness(1)" 
    end)
    el:addEventListener("mouseenter", function() el.style.filter = "brightness(1.1)" end)
    
    el:addEventListener("click", function()
        if not holdEnabled then
            for i, cb in ipairs(obj.callbacks) do cb() end
        end
    end)

    previewArea:appendChild(el)
    
    function obj:onClick(cb) table.insert(obj.callbacks, cb) end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    
    function obj:setHold(enabled, duration)
        holdEnabled = enabled and true or false
        if type(duration) == "number" then
            holdDuration = duration * 1000
        end
    end
    
    addTextMethods(obj, el, textSpan)
    addVisibilityMethods(obj, el)
    return obj
end

-- ==========================================
-- Label
-- ==========================================
_G.label = {}
function _G.label.new(size, pos, text, textColor, textSize, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 30)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.style.color = parseColor(textColor, "#ffffff")
    el.style.fontSize = (textSize or 14).."px"
    el.style.zIndex = tostring(layer or 1)
    
    local textSpan = document:createElement("span")
    textSpan.innerText = text or "Label"
    el:appendChild(textSpan)
    
    el.style.fontFamily = "sans-serif"; el.style.display = "flex"
    el.style.alignItems = "center"; el.style.justifyContent = "center"
    
    previewArea:appendChild(el)
    local obj = { element = el }
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addTextMethods(obj, el, textSpan)
    addVisibilityMethods(obj, el)
    return obj
end

-- ==========================================
-- Text Input
-- ==========================================
_G.input = {}
function _G.input.new(size, pos, placeholder, bgColor, textColor, radius, layer)
    local el = document:createElement("input")
    el.type = "text"
    el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 40)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.placeholder = placeholder or "Enter text..."
    el.style.backgroundColor = parseColor(bgColor, "#11111b")
    el.style.color = parseColor(textColor, "#cdd6f4")
    el.style.borderRadius = (radius or 4).."px"
    el.style.zIndex = tostring(layer or 1)
    el.style.border = "1px solid #313244"
    el.style.padding = "0 10px"
    el.style.outline = "none"
    el.style.fontFamily = "sans-serif"
    
    el:addEventListener("focus", function() el.style.borderColor = "#89b4fa" end)
    el:addEventListener("blur", function() el.style.borderColor = "#313244" end)
    
    previewArea:appendChild(el)
    local obj = { element = el }
    function obj:getText() return el.value end
    function obj:setText(t) el.value = t end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addVisibilityMethods(obj, el)
    return obj
end

-- ==========================================
-- Progress Bar
-- ==========================================
_G.progressbar = {}
function _G.progressbar.new(size, pos, bgColor, fillValue, fillColor, radius, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 200, 20)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.style.backgroundColor = parseColor(bgColor, "#11111b")
    el.style.borderRadius = (radius or 8).."px"
    el.style.overflow = "hidden"
    el.style.zIndex = tostring(layer or 1)

    local fillEl = document:createElement("div")
    fillEl.style.height = "100%"
    fillEl.style.backgroundColor = parseColor(fillColor, "#a6e3a1")
    
    local pct = (tonumber(fillValue) or 0) * 100
    fillEl.style.width = math.max(0, math.min(100, pct)) .. "%"
    fillEl.style.transition = "width 0.3s ease"
    el:appendChild(fillEl)

    previewArea:appendChild(el)
    local obj = { element = el, fillEl = fillEl }
    function obj:setValue(val) 
        local v = (tonumber(val) or 0) * 100
        fillEl.style.width = math.max(0, math.min(100, v)) .. "%" 
    end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addVisibilityMethods(obj, el)
    return obj
end

-- ==========================================
-- Toggle Switch
-- ==========================================
_G.toggle = {}
function _G.toggle.new(size, pos, activeColor, inactiveColor, startState, layer)
    local el = document:createElement("div")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 50, 26)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.style.borderRadius = "999px"
    el.style.cursor = "pointer"
    el.style.zIndex = tostring(layer or 1)
    el.style.transition = "background-color 0.3s"

    local ac = parseColor(activeColor, "#a6e3a1")
    local ic = parseColor(inactiveColor, "#45475a")
    local state = startState and true or false
    el.style.backgroundColor = state and ac or ic

    local hNum = tonumber(string.match(h, "%d+")) or 26
    local wNum = tonumber(string.match(w, "%d+")) or 50
    local knobSize = (hNum - 4) .. "px"
    local knobRight = (wNum - hNum + 2) .. "px"

    local knob = document:createElement("div")
    knob.style.position = "absolute"
    knob.style.top = "2px"
    knob.style.width = knobSize
    knob.style.height = knobSize
    knob.style.backgroundColor = "#ffffff"
    knob.style.borderRadius = "50%"
    knob.style.transition = "left 0.3s"
    knob.style.left = state and knobRight or "2px"
    knob.style.boxShadow = "0 1px 3px rgba(0,0,0,0.3)"
    el:appendChild(knob)

    previewArea:appendChild(el)

    local obj = { element = el, state = state, callbacks = {} }
    el:addEventListener("click", function()
        obj.state = not obj.state
        el.style.backgroundColor = obj.state and ac or ic
        knob.style.left = obj.state and knobRight or "2px"
        for i, cb in ipairs(obj.callbacks) do cb(obj.state) end
    end)

    function obj:onChange(cb) table.insert(obj.callbacks, cb) end
    function obj:getState() return self.state end
    function obj:setState(s)
        self.state = s and true or false
        el.style.backgroundColor = self.state and ac or ic
        knob.style.left = self.state and knobRight or "2px"
    end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addVisibilityMethods(obj, el)
    return obj
end

-- ==========================================
-- Dropdown Menu
-- ==========================================
_G.dropdown = {}
function _G.dropdown.new(size, pos, options, bgColor, textColor, radius, layer)
    local el = document:createElement("select")
    el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 40)
    el.style.width = w; el.style.height = h
    
    -- Bottom-Left Origin + Center Translate
    local x, y = parseCoord(pos, 0, 0)
    el.style.left = x; el.style.bottom = y
    el.style.translate = "-50% 50%"
    
    el.style.backgroundColor = parseColor(bgColor, "#181825")
    el.style.color = parseColor(textColor, "#cdd6f4")
    el.style.borderRadius = (radius or 4).."px"
    el.style.zIndex = tostring(layer or 1)
    el.style.border = "1px solid #313244"
    el.style.padding = "0 10px"
    el.style.outline = "none"
    el.style.fontFamily = "sans-serif"
    el.style.cursor = "pointer"

    if type(options) == "table" then
        for i, opt in ipairs(options) do
            local optionEl = document:createElement("option")
            optionEl.value = tostring(opt)
            optionEl.innerText = tostring(opt)
            el:appendChild(optionEl)
        end
    end

    previewArea:appendChild(el)
    local obj = { element = el, callbacks = {} }
    el:addEventListener("change", function()
        for i, cb in ipairs(obj.callbacks) do cb(el.value) end
    end)
    function obj:onSelect(cb) table.insert(obj.callbacks, cb) end
    function obj:getValue() return el.value end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addVisibilityMethods(obj, el)
    return obj
end
    </script>

    <!-- Default User Code inside a script block to protect it -->
    <script id="default-lua" type="text/plain">
clearUI()

print("Welcome to Lua UI Editor! Origin (0,0) is Bottom-Left. Size expands from Center!")

-- 1. Image Background Frame
local bg = imageframe.new({400, 350}, {220, 220}, "https://picsum.photos/400/350", 12, 1)
bg:setDraggable(true)

-- 2. Glass Panel on top
local panel = frame.new({360, 310}, {220, 220}, {30, 30, 46, 0.9}, 12, 2)
panel:setDraggable(true)

local title = label.new({360, 30}, {220, 340}, "Game Settings", "#89b4fa", 20, 3)

-- 3. Toggle Switch for Audio
local audioToggle = toggle.new({50, 26}, {100, 290}, "#a6e3a1", "#45475a", true, 3)
local audioLabel = label.new({100, 26}, {180, 290}, "Audio Enabled", "#cdd6f4", 14, 3)
audioLabel:setTextPlacement(false, {-20, 0})

audioToggle:onChange(function(state)
    audioLabel:setText(state and "Audio Enabled" or "Audio Disabled")
    print("Audio toggled to: " .. tostring(state))
end)

-- 4. Dropdown Menu for Quality
local ddLabel = label.new({100, 30}, {100, 240}, "Graphics:", "#cdd6f4", 14, 3)
ddLabel:setTextPlacement(false, {-20, 0})
local qualityDropdown = dropdown.new({150, 30}, {220, 240}, {"Low", "Medium", "High", "Ultra"}, "#11111b", "#cdd6f4", 6, 3)

qualityDropdown:onSelect(function(val)
    print("Graphics set to: " .. val)
end)

-- 5. Progress Bar for Master Volume
local volLabel = label.new({100, 20}, {100, 190}, "Master Volume", "#cdd6f4", 14, 3)
volLabel:setTextPlacement(false, {-5, 0})
local volBar = progressbar.new({220, 15}, {240, 190}, "#11111b", 0.7, "#cba6f7", 8, 3)

-- 6. Interactive Buttons (with hold/hide functionality!)
local boostBtn = btn.new({140, 35}, {130, 120}, "#89b4fa", 6, "Boost Vol +10%", "#11111b", 3)
local hideBtn = btn.new({140, 35}, {290, 120}, "#f38ba8", 6, "Hold to Hide BG", "#11111b", 3)
local currentVol = 0.7
local bgVisible = true

-- Make the hide button require a 2 second hold to trigger!
hideBtn:setHold(true, 2)

boostBtn:onClick(function()
    currentVol = currentVol + 0.1
    if currentVol > 1 then currentVol = 0 end
    volBar:setValue(currentVol)
    print("Volume adjusted to: " .. math.floor(currentVol * 100) .. "%")
end)

hideBtn:onClick(function()
    bgVisible = not bgVisible
    
    -- Here is where we hide or show the background!
    if bgVisible then bg:show() else bg:hide() end
    
    hideBtn:setText(bgVisible and "Hold to Hide BG" or "Hold to Show BG")
    print(bgVisible and "Background restored" or "Background hidden")
end)
    </script>

                    <i class="ph-bold ph-terminal text-[#f38ba8]"></i> Output Console
                </div>
                <div id="console-output" class="flex-1 overflow-y-auto p-3 text-[13px] font-mono text-[#a6adc8] space-y-1 select-text">
                    <!-- Logs injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        // Setup JS-side Dragging (Optimized for Bottom-Left coordinates)
        window.makeElementDraggable = function(el) {
            let isDragging = false;
            let startX, startY, initialX, initialY;
            let animationFrameId = null;

            const updatePosition = (clientX, clientY) => {
                const dx = clientX - startX;
                const dy = startY - clientY; // Invert delta Y because Y goes up in our system!
                el.style.left = (initialX + dx) + "px";
                el.style.bottom = (initialY + dy) + "px";
            };

            const onMouseMove = (e) => {
                if (!isDragging) return;
                const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
                const clientY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
                if (clientX === undefined || clientY === undefined) return;
                
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                animationFrameId = requestAnimationFrame(() => updatePosition(clientX, clientY));
            };

            const onMouseUp = () => {
                isDragging = false;
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                document.removeEventListener("mousemove", onMouseMove);
                document.removeEventListener("mouseup", onMouseUp);
                document.removeEventListener("touchmove", onMouseMove);
                document.removeEventListener("touchend", onMouseUp);
            };

            const onMouseDown = (e) => {
                // Ignore drags starting on inputs, textareas, selects, or interactive children
                if (['INPUT', 'TEXTAREA', 'SELECT', 'OPTION'].includes(e.target.tagName)) return;

                isDragging = true;
                startX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
                startY = e.clientY !== undefined ? e.clientY : (e.touches && e.touches[0].clientY);
                initialX = parseFloat(el.style.left) || 0;
                initialY = parseFloat(el.style.bottom) || 0;
                
                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);
                document.addEventListener("touchmove", onMouseMove, {passive: false});
                document.addEventListener("touchend", onMouseUp);
            };

            el.addEventListener("mousedown", onMouseDown);
            el.addEventListener("touchstart", onMouseDown, {passive: true});
        };

        let editor;
        let frameworkLoaded = false;

        // Tooltip logic constants
        const paramSignatures = {
            'frame': ['size', 'pos', 'color', 'radius', 'layer'],
            'btn': ['size', 'pos', 'color', 'radius', 'text', 'textColor', 'layer'],
            'label': ['size', 'pos', 'text', 'textColor', 'textSize', 'layer'],
            'input': ['size', 'pos', 'placeholder', 'bgColor', 'textColor', 'radius', 'layer'],
            'imageframe': ['size', 'pos', 'url', 'radius', 'layer'],
            'progressbar': ['size', 'pos', 'bgColor', 'fillValue', 'fillColor', 'radius', 'layer'],
            'toggle': ['size', 'pos', 'activeColor', 'inactiveColor', 'startState', 'layer'],
            'dropdown': ['size', 'pos', 'options', 'bgColor', 'textColor', 'radius', 'layer']
        };

        // --- Initialization ---
        document.addEventListener("DOMContentLoaded", () => {
            editor = ace.edit("editor");
            editor.setTheme("ace/theme/tomorrow_night_eighties");
            editor.session.setMode("ace/mode/lua");
            editor.setOptions({
                fontFamily: "ui-monospace, SFMono-Regular, Consolas, monospace",
                fontSize: "14px",
                showPrintMargin: false,
                enableBasicAutocompletion: true,
                enableLiveAutocompletion: true,
                tabSize: 4,
                useSoftTabs: true
            });
            
            // Load the default script safely from the hidden HTML tag
            const defaultScriptRaw = document.getElementById('default-lua').textContent.trim();
            editor.setValue(defaultScriptRaw, -1);
            editor.clearSelection(); 
            
            editor.commands.addCommand({
                name: 'runScript',
                bindKey: {win: 'F5|Ctrl-Enter',  mac: 'F5|Command-Enter'},
                exec: function() { runScript(); }
            });

            // Smart Parameter Hover Logic
            const tooltipEl = document.getElementById('param-tooltip');
            editor.on("mousemove", function (e) {
                const pos = e.getDocumentPosition();
                const line = editor.session.getLine(pos.row);
                
                const beforeCursor = line.substring(0, pos.column);
                const match = beforeCursor.match(/(frame|btn|label|input|imageframe|progressbar|toggle|dropdown)\.new\s*\([^)]*$/);
                
                if (match) {
                    const type = match[1];
                    const argsStr = match[0].substring(match[0].indexOf('(') + 1);
                    
                    let argIndex = 0;
                    let depth = 0;
                    let inString = false;
                    let stringChar = '';
                    
                    for (let i = 0; i < argsStr.length; i++) {
                        let char = argsStr[i];
                        if (inString) {
                            if (char === stringChar) inString = false;
                        } else {
                            if (char === '"' || char === "'") { inString = true; stringChar = char; }
                            else if (char === '{') depth++;
                            else if (char === '}') depth--;
                            else if (char === ',' && depth === 0) argIndex++;
                        }
                    }
                    
                    const sigArray = paramSignatures[type];
                    if (sigArray && argIndex < sigArray.length) {
                        let html = `<span class="text-[#89b4fa]">${type}.new</span>( `;
                        for(let i=0; i<sigArray.length; i++){
                            if(i === argIndex) html += `<span class="text-[#a6e3a1] font-bold underline px-1 bg-[#a6e3a1]/20 rounded">${sigArray[i]}</span>`;
                            else html += `<span class="text-[#a6adc8]">${sigArray[i]}</span>`;
                            if(i < sigArray.length-1) html += '<span class="text-[#6c7086]">, </span>';
                        }
                        html += ' )';
                        
                        tooltipEl.innerHTML = html;
                        tooltipEl.style.left = (e.domEvent.clientX + 15) + 'px';
                        tooltipEl.style.top = (e.domEvent.clientY + 15) + 'px';
                        tooltipEl.classList.remove('hidden');
                        return;
                    }
                }
                tooltipEl.classList.add('hidden');
            });

            document.getElementById('editor').addEventListener('mouseleave', () => {
                tooltipEl.classList.add('hidden');
            });

            uiPrint("Environment ready. Press Ctrl+Enter to execute UI code.", "text-[#89b4fa]");
            setTimeout(runScript, 300);
        });

        // --- Toolbar Utilities ---

        function formatCode() {
            let code = editor.getValue();
            let lines = code.split('\n');
            let indent = 0;
            let out = [];
            for (let line of lines) {
                line = line.trim();
                if (!line) { out.push(''); continue; }
                
                // Decrease indent before writing line
                if (line.match(/^(end|elseif|else|until)\b/) || line.match(/^}/)) {
                    indent = Math.max(0, indent - 1);
                }
                
                out.push('    '.repeat(indent) + line);
                
                // Increase indent for next line
                if (line.match(/\bthen\b\s*(--.*)?$/) || 
                    line.match(/\bdo\b\s*(--.*)?$/) || 
                    line.match(/\bfunction.*[^{]\s*(--.*)?$/) || 
                    line.match(/^else\b/) || 
                    line.match(/^elseif\b/) || 
                    line.match(/\brepeat\b\s*(--.*)?$/) ||
                    line.match(/{\s*(--.*)?$/)) {
                    indent++;
                }
            }
            editor.setValue(out.join('\n'), -1);
            uiPrint("Code neatly formatted.", "text-[#a6e3a1]");
        }

        function clearComments() {
            let code = editor.getValue();
            let out = "";
            let inString = false;
            let stringChar = '';
            
            for (let i = 0; i < code.length; i++) {
                if (inString) {
                    out += code[i];
                    if (code[i] === '\\') {
                        i++;
                        if (i < code.length) out += code[i];
                    } else if (code[i] === stringChar) {
                        inString = false;
                    }
                } else {
                    if (code[i] === '"' || code[i] === "'") {
                        inString = true;
                        stringChar = code[i];
                        out += code[i];
                    } else if (code.substring(i, i + 4) === '--[[') {
                        let endIdx = code.indexOf(']]', i + 4);
                        if (endIdx === -1) endIdx = code.length;
                        else endIdx += 2;

                        let start = i;
                        let removeBefore = 0;
                        while (start - removeBefore - 1 >= 0 && (code[start - removeBefore - 1] === ' ' || code[start - removeBefore - 1] === '\t')) {
                            removeBefore++;
                        }
                        let isStartOfLine = (start - removeBefore === 0 || code[start - removeBefore - 1] === '\n');

                        let removeAfter = 0;
                        if (code[endIdx] === '\r') removeAfter++;
                        if (code[endIdx + removeAfter] === '\n') removeAfter++;
                        let isEndOfLine = (removeAfter > 0 || endIdx === code.length);

                        if (isStartOfLine && isEndOfLine) {
                            out = out.substring(0, out.length - removeBefore);
                            i = endIdx + removeAfter - 1;
                        } else {
                            out = out.substring(0, out.length - removeBefore);
                            i = endIdx - 1;
                        }
                    } else if (code.substring(i, i + 2) === '--') {
                        let endIdx = code.indexOf('\n', i + 2);
                        if (endIdx === -1) endIdx = code.length;

                        let start = i;
                        let removeBefore = 0;
                        while (start - removeBefore - 1 >= 0 && (code[start - removeBefore - 1] === ' ' || code[start - removeBefore - 1] === '\t')) {
                            removeBefore++;
                        }
                        let isStartOfLine = (start - removeBefore === 0 || code[start - removeBefore - 1] === '\n');

                        if (isStartOfLine) {
                            out = out.substring(0, out.length - removeBefore);
                            i = endIdx; 
                        } else {
                            out = out.substring(0, out.length - removeBefore);
                            i = endIdx - 1; 
                        }
                    } else {
                        out += code[i];
                    }
                }
            }
            
            editor.setValue(out, -1);
            uiPrint("Comments cleared safely.", "text-[#a6e3a1]");
        }

        function copyCode() {
            navigator.clipboard.writeText(editor.getValue());
            uiPrint("Code copied to clipboard!", "text-[#a6e3a1]");
        }

        // --- Execution Logic ---
        function runScript() {
            const btn = document.getElementById('btnPlay');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="ph-bold ph-spinner animate-spin"></i> Running...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                const code = editor.getValue();
                try {
                    // Prevent memory leak by only loading framework once
                    if (!frameworkLoaded) {
                        // Extract Lua code directly from the hidden HTML tag (Bypasses OneCompiler minifier bugs)
                        const frameworkSetupLua = document.getElementById('framework-lua').textContent;
                        fengari.load(frameworkSetupLua)();
                        frameworkLoaded = true;
                    }
                    fengari.load(code, "main.lua")();
                } catch(err) {
                    uiError(err.toString());
                }
                btn.innerHTML = originalHtml;
                btn.classList.remove('opacity-80');
            }, 50);
        }

        // --- Console Logic ---
        window.uiPrint = function(msg, customClass = "text-[#cdd6f4]") { appendLog(msg, customClass); }
        window.uiWarn = function(msg) { appendLog(`[WARN] ${msg}`, "text-[#f9e2af] bg-[#f9e2af]/10 border-l-2 border-[#f9e2af] pl-2"); }
        function uiError(msg) { appendLog(`[ERROR] ${msg}`, "text-[#f38ba8] bg-[#f38ba8]/10 border-l-2 border-[#f38ba8] pl-2 font-semibold"); }

        function appendLog(msg, classes) {
            const consoleDiv = document.getElementById('console-output');
            const line = document.createElement('div');
            const now = new Date();
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;
            
            line.innerHTML = `<span class="text-[#6c7086] mr-2">[${timeStr}]</span> <span>${msg}</span>`;
            line.className = `py-1 border-b border-[#313244]/50 hover:bg-[#313244]/30 ${classes}`;
            
            consoleDiv.appendChild(line);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function clearConsole() { document.getElementById('console-output').innerHTML = ''; }
    </script>
</body>
</html>
