<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / Home Screen Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Soft UI">
    <meta name="theme-color" content="#F0F4F8">
    
    <title>Soft UI App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #F0F4F8;
        }

        /* Prevent rubber-banding and selection */
        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            color: #5D6D7E;
            background-image: 
                radial-gradient(#E8EEF5 15%, transparent 16%),
                radial-gradient(#E8EEF5 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
        }

        .serif { font-family: 'Playfair Display', serif; }

        /* --- STYLES --- */
        
        /* Plush */
        .style-plush {
            background: #FFF0F3;
            border-radius: 30px;
            box-shadow: 12px 12px 24px #e6d3d8, -12px -12px 24px #ffffff;
            border: 2px solid #fff;
        }

        /* Glass */
        .style-glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(100, 116, 139, 0.15);
        }

        /* Clay */
        .style-clay {
            background: #E8F5E9;
            border-radius: 50px;
            box-shadow: 8px 8px 16px #cbdacb, -8px -8px 16px #ffffff;
        }

        /* Resin */
        .style-resin {
            background: linear-gradient(135deg, rgba(226, 219, 245, 0.6), rgba(255, 255, 255, 0.2));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 99px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px rgba(159, 122, 234, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
        }
        .resin-inset {
            background: rgba(0, 0, 0, 0.03);
            border-radius: 99px;
            box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.05), inset -2px -2px 6px rgba(255, 255, 255, 0.4);
        }

        /* Overlay */
        #start-overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
            background-image: 
                radial-gradient(#E8EEF5 15%, transparent 16%),
                radial-gradient(#E8EEF5 15%, transparent 16%);
            background-size: 20px 20px;
        }

        /* Animations */
        @keyframes bounceIn {
            0% { transform: scale(0.3) translateY(20px); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        @keyframes slideFloat {
            0% { transform: translateX(100%) skewX(-5deg); opacity: 0; }
            100% { transform: translateX(0) skewX(0); opacity: 1; }
        }

        .notification-area {
            position: fixed;
            bottom: 30px;
            right: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 50;
            pointer-events: none;
        }
        .notification-item {
            pointer-events: auto;
            width: 90%;
            max-width: 360px;
            cursor: pointer;
        }

        /* Blobs */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(50px);
            z-index: -1;
            opacity: 0.8;
            animation: moveBlob 8s infinite alternate ease-in-out;
        }
        @keyframes moveBlob {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(20px, -20px) scale(1.1); }
        }
    </style>
</head>
<body class="flex flex-col items-center p-6 relative h-full overflow-y-auto">

    <!-- OVERLAY -->
    <div id="start-overlay">
        <div class="mb-8 w-24 h-24 rounded-full bg-[#E0E5EC] shadow-[9px_9px_16px_rgb(163,177,198,0.6),-9px_-9px_16px_rgba(255,255,255,0.5)] flex items-center justify-center text-4xl text-purple-400">
            <i class="fa-solid fa-sparkles"></i>
        </div>
        <h1 class="text-3xl font-bold text-slate-600 serif italic mb-2">Soft UI App</h1>
        <p class="text-slate-400 mb-8 text-center max-w-xs leading-relaxed">
            <span class="text-sm font-bold block mb-2">Tap Share <i class="fa-solid fa-arrow-up-from-bracket"></i> to Add to Home Screen</span>
        </p>
        
        <button onclick="enterApp()" class="style-resin px-10 py-4 font-bold text-purple-700 uppercase tracking-widest shadow-lg active:scale-95 transition-transform">
            Open Preview
        </button>
    </div>

    <!-- Background Blobs -->
    <div class="blob w-64 h-64 bg-pink-200" style="top: 10%; left: 10%;"></div>
    <div class="blob w-80 h-80 bg-blue-200" style="bottom: 10%; right: 10%;"></div>
    
    <!-- Content Wrapper -->
    <div class="w-full max-w-md flex flex-col items-center pt-8 pb-32">
        <header class="text-center mb-8 relative z-10">
            <h1 class="text-4xl text-slate-600 serif italic mb-1">The Collection</h1>
            <p class="text-slate-400 font-bold tracking-widest uppercase text-xs">Tap to trigger</p>
        </header>

        <!-- Vertical Mobile Layout -->
        <div class="flex flex-col gap-6 w-full relative z-10">
            
            <!-- Plush -->
            <div onclick="notify('plush')" class="style-plush p-4 flex items-center justify-between active:scale-95 transition-transform cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#FFD6E0] shadow-inner flex items-center justify-center text-[#8C5E69]">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-[#8C5E69] serif">Plush</h2>
                        <p class="text-xs text-[#8C5E69]/70">Warm & Matte</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-[#FFD6E0] flex items-center justify-center text-[#8C5E69] text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

            <!-- Glass -->
            <div onclick="notify('glass')" class="style-glass p-4 flex items-center justify-between active:scale-95 transition-transform cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-lg bg-white/20 border border-white/50 flex items-center justify-center text-slate-500">
                        <i class="fa-solid fa-gem"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-slate-600 serif">Glass</h2>
                        <p class="text-xs text-slate-500">Sharp & Clear</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-white/40 flex items-center justify-center text-slate-500 text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

            <!-- Clay -->
            <div onclick="notify('clay')" class="style-clay p-4 flex items-center justify-between active:scale-95 transition-transform cursor-pointer">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-[#E8F5E9] shadow-[2px_2px_5px_#8eb990,-2px_-2px_5px_#ffffff] flex items-center justify-center text-[#1B5E20]">
                        <i class="fa-solid fa-leaf"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-[#2E7D32] serif">Clay</h2>
                        <p class="text-xs text-[#2E7D32]/70">Solid & Tactile</p>
                    </div>
                </div>
                <div class="w-8 h-8 rounded-full bg-[#A5D6A7] flex items-center justify-center text-[#1B5E20] text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

             <!-- Resin -->
             <div onclick="notify('resin')" class="style-resin p-4 flex items-center justify-between relative overflow-hidden active:scale-95 transition-transform cursor-pointer">
                <div class="absolute inset-0 bg-white/10 blur-xl"></div>
                <div class="flex items-center gap-4 relative z-10">
                    <div class="w-12 h-12 rounded-full bg-purple-200/50 backdrop-blur-sm border border-white/60 flex items-center justify-center text-purple-700">
                        <i class="fa-solid fa-star"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="text-lg font-bold text-purple-700 serif">Gummy</h2>
                        <p class="text-xs text-purple-700/70">Hybrid Pop</p>
                    </div>
                </div>
                <div class="relative z-10 w-8 h-8 rounded-full bg-purple-300/50 flex items-center justify-center text-purple-700 text-xs">
                    <i class="fa-solid fa-play"></i>
                </div>
            </div>

        </div>
    </div>

    <!-- Notification Container -->
    <div id="notifications" class="notification-area"></div>

    <script>
        // CHECK FOR HOME SCREEN MODE
        function checkStandalone() {
            // Check if running in standalone mode (installed app)
            const isStandalone = window.navigator.standalone || 
                                 window.matchMedia('(display-mode: standalone)').matches;
            
            if (isStandalone) {
                // Hide overlay immediately if installed
                document.getElementById('start-overlay').style.display = 'none';
            }
        }
        
        checkStandalone();

        function enterApp() {
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                
                // Try Fullscreen API (works on Android Chrome sometimes)
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen().catch(e => {});
            }, 500);
        }

        const container = document.getElementById('notifications');

        const content = {
            plush: { title: "Liked", msg: "Softest like ever.", icon: "fa-heart" },
            glass: { title: "Airdrop", msg: "photo_01.jpg", icon: "fa-wifi" },
            clay: { title: "Done", msg: "Task completed.", icon: "fa-check" },
            resin: { title: "Reminder", msg: "Pilates at 4:00 PM", icon: "fa-bell" }
        };

        function notify(type) {
            if (navigator.vibrate) navigator.vibrate(10);

            const data = content[type];
            const el = document.createElement('div');
            el.className = `notification-item`;
            
            if (type === 'plush') {
                el.style.animation = "bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards";
                el.innerHTML = `
                    <div class="style-plush p-4 flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-[#FFD6E0] shadow-inner flex items-center justify-center text-[#8C5E69]">
                            <i class="fa-solid ${data.icon}"></i>
                        </div>
                        <div>
                            <h4 class="serif font-bold text-[#8C5E69]">${data.title}</h4>
                            <p class="text-xs text-[#8C5E69]/70 font-bold">${data.msg}</p>
                        </div>
                    </div>`;
            } else if (type === 'glass') {
                el.style.animation = "slideFloat 0.5s ease-out forwards";
                el.innerHTML = `
                    <div class="style-glass p-4 flex items-center justify-between backdrop-blur-md">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 rounded-lg border border-white/40 bg-white/20 flex items-center justify-center text-slate-600">
                                <i class="fa-solid ${data.icon}"></i>
                            </div>
                            <div>
                                <h4 class="serif italic text-slate-700 text-lg">${data.title}</h4>
                                <p class="text-xs text-slate-500 font-mono">${data.msg}</p>
                            </div>
                        </div>
                    </div>`;
            } else if (type === 'clay') {
                el.style.animation = "bounceIn 0.4s ease-out forwards";
                el.innerHTML = `
                    <div class="style-clay p-3 flex items-center gap-3 pr-6">
                        <div class="w-10 h-10 rounded-full bg-[#A5D6A7] shadow-[2px_2px_5px_#8eb990,-2px_-2px_5px_#ffffff] flex items-center justify-center text-white">
                            <i class="fa-solid ${data.icon}"></i>
                        </div>
                        <div class="flex-1 bg-[#E8F5E9] shadow-inner rounded-full px-4 py-2">
                            <h4 class="font-bold text-[#2E7D32] text-xs uppercase tracking-wider">${data.title}</h4>
                            <p class="text-xs text-[#2E7D32]/70">${data.msg}</p>
                        </div>
                    </div>`;
            } else if (type === 'resin') {
                el.style.animation = "bounceIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards";
                el.innerHTML = `
                    <div class="style-resin p-3 flex items-center gap-3 pr-4 backdrop-blur-xl">
                        <div class="w-12 h-12 rounded-full bg-purple-100/40 border border-white/60 flex items-center justify-center text-purple-600 shadow-sm backdrop-blur-sm">
                            <i class="fa-solid ${data.icon}"></i>
                        </div>
                        <div class="resin-inset flex-1 px-4 py-2 flex justify-between items-center">
                            <div>
                                <h4 class="serif italic font-bold text-purple-800 text-lg leading-tight">${data.title}</h4>
                                <p class="text-xs text-purple-700/80 font-medium">${data.msg}</p>
                            </div>
                            <button onclick="event.stopPropagation(); this.closest('.notification-item').remove()" class="text-purple-400 hover:text-purple-600"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>`;
            }

            container.appendChild(el);

            el.onclick = () => {
                el.style.transition = "all 0.3s ease";
                el.style.opacity = '0';
                el.style.transform = 'scale(0.8)';
                setTimeout(() => el.remove(), 300);
            };

            setTimeout(() => {
                if(el.parentNode) {
                    el.style.transition = "all 0.5s ease";
                    el.style.opacity = '0';
                    el.style.transform = 'translateY(10px)';
                    setTimeout(() => { if(el.parentNode) el.remove() }, 500);
                }
            }, 4000);
        }
    </script>
</body>
</html>
