<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Nexus</title>
    
    <!-- Tailwind CSS (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Babel (To compile React in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Map for React & Icons -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#F3F4F6] text-gray-800 h-screen overflow-hidden">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Calendar, CheckSquare, Mail, LayoutGrid, Search, 
            Plus, MoreVertical, Clock, Video, Sparkles, 
            Bell, Menu, X, CloudSun, FileText, ChevronRight,
            BarChart3, Image as ImageIcon, MapPin
        } from 'lucide-react';

        // --- Mock Data ---
        const MOCK_EVENTS = [
            { id: 1, title: 'Product Design Review', time: '10:00 AM', duration: '1h', type: 'video' },
            { id: 2, title: 'Lunch with Client', time: '12:30 PM', duration: '1.5h', type: 'location' },
            { id: 3, title: 'Q4 Strategy Planning', time: '03:00 PM', duration: '2h', type: 'video' },
        ];

        // --- Components ---
        const SidebarItem = ({ icon: Icon, label, active, onClick, collapsed }) => (
            <button 
                onClick={onClick}
                className={`flex items-center w-full p-3 mb-2 rounded-xl transition-all duration-200 ${
                    active ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'text-gray-500 hover:bg-gray-100'
                }`}
            >
                <Icon size={20} />
                {!collapsed && <span className="ml-3 text-sm font-medium">{label}</span>}
            </button>
        );

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white p-6 rounded-2xl shadow-sm border border-gray-100 ${className}`}>
                {children}
            </div>
        );

        // --- Views ---
        const Dashboard = ({ tasks, toggleTask }) => (
            <div className="space-y-6 animate-fade-in">
                {/* Hero Section */}
                <div className="flex flex-col md:flex-row justify-between items-end gap-4">
                    <div>
                        <h2 className="text-3xl font-light text-gray-800">Good Afternoon, <span className="font-semibold">User.</span></h2>
                        <div className="flex items-center text-gray-500 gap-3 mt-2 text-sm">
                            <span className="flex items-center bg-white px-3 py-1 rounded-full shadow-sm border border-gray-100">
                                <CloudSun size={14} className="mr-2 text-orange-400" /> 72°F Sunny
                            </span>
                            <span>You have 3 meetings left today.</span>
                        </div>
                    </div>
                    <button className="bg-gray-900 text-white px-5 py-2.5 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all flex items-center font-medium text-sm">
                        <Plus size={16} className="mr-2" /> Quick Action
                    </button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    {/* Main Column */}
                    <div className="lg:col-span-8 space-y-6">
                        {/* Next Up Card */}
                        <div className="bg-gradient-to-br from-indigo-600 to-purple-700 text-white p-8 rounded-3xl shadow-xl relative overflow-hidden group">
                            <div className="absolute top-0 right-0 -mr-8 -mt-8 w-40 h-40 bg-white opacity-10 rounded-full blur-3xl group-hover:scale-150 transition-transform duration-700"></div>
                            <div className="flex justify-between items-start mb-6 relative z-10">
                                <span className="bg-white/20 backdrop-blur-md text-xs font-bold px-3 py-1 rounded-full uppercase border border-white/10">Up Next • 10:00 AM</span>
                                <MoreVertical size={18} className="text-white/70 cursor-pointer hover:text-white" />
                            </div>
                            <h3 className="text-3xl font-bold mb-3 relative z-10">Product Design Review</h3>
                            <div className="flex items-center text-indigo-100 text-sm mb-6 relative z-10">
                                <Clock size={16} className="mr-2" /> 1h 
                                <span className="mx-4 opacity-50">|</span>
                                <Video size={16} className="mr-2" /> Google Meet
                            </div>
                            {/* AI Context */}
                            <div className="bg-white/10 backdrop-blur-sm rounded-xl p-4 border border-white/10 relative z-10">
                                <div className="flex items-center text-xs text-indigo-200 mb-3 uppercase font-bold tracking-wider">
                                    <Sparkles size={12} className="mr-2 text-yellow-300" /> Nexus Context
                                </div>
                                <div className="flex gap-3">
                                    <button className="bg-white text-indigo-900 px-4 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-indigo-50 transition-colors flex items-center">
                                        <FileText size={14} className="mr-2 text-indigo-500" /> Agenda.pdf
                                    </button>
                                    <button className="bg-white text-indigo-900 px-4 py-2 rounded-lg text-xs font-bold shadow-sm hover:bg-indigo-50 transition-colors flex items-center">
                                        <Mail size={14} className="mr-2 text-indigo-500" /> 3 Related Emails
                                    </button>
                                </div>
                            </div>
                        </div>

                        {/* Recent Files */}
                        <div>
                            <h3 className="font-bold text-gray-800 mb-4 ml-1">Jump Back In</h3>
                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                {[
                                    {name: 'Q3_Report.pdf', type: 'PDF', color: 'bg-red-100 text-red-600', icon: FileText},
                                    {name: 'Marketing_Assets', type: 'Folder', color: 'bg-blue-100 text-blue-600', icon: ImageIcon},
                                    {name: 'Budget_2025.xlsx', type: 'Sheet', color: 'bg-green-100 text-green-600', icon: BarChart3}
                                ].map((f, i) => (
                                    <div key={i} className="bg-white p-4 rounded-2xl border border-gray-100 flex items-center gap-4 hover:shadow-lg hover:-translate-y-1 transition-all cursor-pointer group">
                                        <div className={`w-12 h-12 rounded-xl ${f.color} flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform`}>
                                            <f.icon size={22} />
                                        </div>
                                        <div className="overflow-hidden">
                                            <span className="block text-sm font-bold text-gray-700 truncate">{f.name}</span>
                                            <span className="block text-xs text-gray-400 mt-0.5">{f.type}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Side Column */}
                    <div className="lg:col-span-4 space-y-6">
                        <Card className="h-full">
                            <div className="flex justify-between items-center mb-6">
                                <h3 className="font-bold text-gray-800">My Tasks</h3>
                                <button className="text-indigo-600 hover:bg-indigo-50 p-2 rounded-lg transition-colors"><Plus size={18} /></button>
                            </div>
                            <div className="space-y-3">
                                {tasks.map(task => (
                                    <div 
                                        key={task.id} 
                                        onClick={() => toggleTask(task.id)}
                                        className="flex items-start group cursor-pointer p-2 hover:bg-gray-50 rounded-lg transition-colors"
                                    >
                                        <div className={`mt-0.5 w-5 h-5 rounded border mr-3 flex items-center justify-center transition-all ${task.done ? 'bg-indigo-600 border-indigo-600' : 'border-gray-300 group-hover:border-indigo-500'}`}>
                                            {task.done && <CheckSquare size={12} className="text-white" />}
                                        </div>
                                        <div className="flex-1">
                                            <span className={`text-sm font-medium ${task.done ? 'text-gray-400 line-through' : 'text-gray-700'}`}>{task.text}</span>
                                            <p className="text-[10px] text-gray-400 mt-1">{task.tag}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <button className="w-full mt-4 py-2 text-xs font-semibold text-gray-400 hover:text-indigo-600 flex items-center justify-center transition-colors">
                                View All Tasks <ChevronRight size={14} className="ml-1" />
                            </button>
                        </Card>
                    </div>
                </div>
            </div>
        );

        const CalendarView = () => (
            <Card className="h-full animate-fade-in">
                <div className="flex justify-between items-center mb-8">
                    <h2 className="text-2xl font-bold text-gray-800">October 2025</h2>
                    <div className="flex gap-2">
                        <button className="px-4 py-2 text-sm font-medium bg-gray-50 text-gray-600 rounded-lg hover:bg-gray-100">Week</button>
                        <button className="px-4 py-2 text-sm font-medium bg-indigo-600 text-white rounded-lg shadow-md shadow-indigo-200">Month</button>
                    </div>
                </div>
                <div className="grid grid-cols-7 gap-4 text-center mb-4">
                    {['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => <div key={d} className="text-xs font-bold text-gray-400 uppercase tracking-wider">{d}</div>)}
                </div>
                <div className="grid grid-cols-7 gap-2">
                    {Array.from({length: 31}, (_, i) => i + 1).map(d => (
                        <div key={d} className={`min-h-[100px] border rounded-xl p-3 text-left hover:bg-gray-50 transition-all cursor-pointer relative ${d===24 ? 'ring-2 ring-indigo-500 border-transparent bg-indigo-50/50' : 'border-gray-100'}`}>
                            <span className={`text-sm font-bold ${d===24 ? 'text-indigo-600' : 'text-gray-700'}`}>{d}</span>
                            {d === 24 && <div className="mt-2 bg-indigo-100 text-indigo-700 text-[10px] px-2 py-1 rounded-md font-bold truncate">Design Review</div>}
                            {d === 12 && <div className="mt-2 bg-orange-100 text-orange-700 text-[10px] px-2 py-1 rounded-md font-bold truncate">Lunch</div>}
                        </div>
                    ))}
                </div>
            </Card>
        );

        const MailView = () => (
            <Card className="h-full animate-fade-in">
                <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-bold text-gray-800">Smart Inbox</h2>
                    <button className="text-sm text-indigo-600 font-medium hover:underline">Mark all read</button>
                </div>
                <div className="space-y-1">
                    {[
                        {from: 'Sarah Connor', subject: 'Re: Skynet Project Timeline', time: '10:42 AM', initial: 'S', color: 'bg-purple-100 text-purple-600', ai: 'Meeting Request'},
                        {from: 'Marketing Team', subject: 'Q4 Assets Final Review', time: '09:15 AM', initial: 'M', color: 'bg-blue-100 text-blue-600', ai: 'Has Attachments'},
                        {from: 'Cloud Billing', subject: 'Invoice #9921 for October', time: 'Yesterday', initial: 'C', color: 'bg-gray-100 text-gray-600', ai: 'Bill: $450'},
                    ].map((mail, i) => (
                        <div key={i} className="flex gap-4 p-4 hover:bg-gray-50 rounded-xl transition-colors cursor-pointer border-b border-gray-50 last:border-0 group">
                            <div className={`w-12 h-12 rounded-full ${mail.color} flex items-center justify-center font-bold text-lg shrink-0`}>{mail.initial}</div>
                            <div className="flex-1 min-w-0">
                                <div className="flex justify-between items-baseline mb-1">
                                    <h4 className="font-bold text-gray-800 text-sm group-hover:text-indigo-600 transition-colors">{mail.from}</h4>
                                    <span className="text-xs text-gray-400 font-medium">{mail.time}</span>
                                </div>
                                <p className="text-sm text-gray-600 truncate font-medium">{mail.subject}</p>
                                <p className="text-xs text-gray-400 truncate mt-1">Hey, just checking in on the latest deliverables for the...</p>
                                <div className="mt-3 inline-flex items-center bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-100 text-indigo-700 text-[10px] px-2 py-1 rounded-md font-semibold">
                                    <Sparkles size={10} className="mr-1" /> AI: {mail.ai}
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            </Card>
        );

        // --- Main App Shell ---
        function NexusApp() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [sidebarOpen, setSidebarOpen] = useState(false);
            const [tasks, setTasks] = useState([
                { id: 1, text: 'Review Q3 Financials', tag: 'Finance', done: false },
                { id: 2, text: 'Email Marketing Team', tag: 'Outreach', done: true },
                { id: 3, text: 'Book Flights for Summit', tag: 'Travel', done: false },
                { id: 4, text: 'Update Jira Ticket', tag: 'Dev', done: false },
            ]);

            const toggleTask = (id) => setTasks(tasks.map(t => t.id === id ? {...t, done: !t.done} : t));

            return (
                <div className="flex h-screen w-full">
                    {/* Sidebar */}
                    <aside className={`fixed lg:relative z-40 h-full bg-white border-r border-gray-200 transition-all duration-300 shadow-xl lg:shadow-none ${sidebarOpen ? 'w-72 translate-x-0' : 'w-72 -translate-x-full lg:translate-x-0'}`}>
                        <div className="p-8 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-200">N</div>
                                <span className="font-bold text-2xl tracking-tight text-gray-800">Nexus</span>
                            </div>
                            <button onClick={() => setSidebarOpen(false)} className="lg:hidden text-gray-400 hover:text-gray-800"><X size={24}/></button>
                        </div>
                        <nav className="px-6 space-y-2">
                            <SidebarItem icon={LayoutGrid} label="Dashboard" active={activeTab==='dashboard'} onClick={() => setActiveTab('dashboard')} />
                            <SidebarItem icon={Calendar} label="Calendar" active={activeTab==='calendar'} onClick={() => setActiveTab('calendar')} />
                            <SidebarItem icon={CheckSquare} label="Tasks" active={activeTab==='tasks'} onClick={() => setActiveTab('tasks')} />
                            <SidebarItem icon={Mail} label="Mail" active={activeTab==='mail'} onClick={() => setActiveTab('mail')} />
                        </nav>
                        <div className="absolute bottom-0 w-full p-8">
                            <div className="bg-gray-50 rounded-2xl p-5 border border-gray-100">
                                <div className="flex justify-between mb-2">
                                    <div className="text-xs font-bold text-gray-400 uppercase">Storage</div>
                                    <div className="text-xs font-bold text-indigo-600">75%</div>
                                </div>
                                <div className="w-full bg-gray-200 h-2 rounded-full overflow-hidden">
                                    <div className="bg-indigo-500 h-full w-3/4 rounded-full"></div>
                                </div>
                                <div className="text-[10px] text-gray-400 mt-2">11.2 GB of 15 GB Used</div>
                            </div>
                        </div>
                    </aside>

                    {/* Mobile Overlay */}
                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden backdrop-blur-sm" onClick={() => setSidebarOpen(false)}></div>}

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col min-w-0 bg-[#F8FAFC]">
                        {/* Header */}
                        <header className="h-20 bg-white/80 backdrop-blur-md border-b border-gray-200 flex items-center justify-between px-8 sticky top-0 z-20">
                            <button onClick={() => setSidebarOpen(true)} className="lg:hidden text-gray-500 mr-4"><Menu size={24}/></button>
                            
                            <div className="flex-1 max-w-xl relative hidden md:block">
                                <Search size={20} className="absolute left-4 top-3 text-gray-400" />
                                <input type="text" placeholder="Ask Nexus..." className="w-full bg-white border border-gray-200 rounded-2xl py-2.5 pl-12 pr-4 text-sm focus:ring-4 focus:ring-indigo-50 focus:border-indigo-500 outline-none transition-all shadow-sm" />
                            </div>

                            <div className="flex items-center gap-6">
                                <button className="text-gray-400 relative hover:text-gray-600 transition-colors">
                                    <Bell size={22} />
                                    <span className="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
                                </button>
                                <div className="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-purple-600 rounded-full text-white flex items-center justify-center text-sm font-bold shadow-md ring-4 ring-white cursor-pointer hover:ring-indigo-100 transition-all">JD</div>
                            </div>
                        </header>

                        {/* Content Area */}
                        <div className="flex-1 overflow-y-auto p-4 lg:p-8 scroll-smooth">
                            <div className="max-w-7xl mx-auto pb-20">
                                {activeTab === 'dashboard' && <Dashboard tasks={tasks} toggleTask={toggleTask} />}
                                {activeTab === 'calendar' && <CalendarView />}
                                {activeTab === 'mail' && <MailView />}
                                {activeTab === 'tasks' && <Card className="animate-fade-in"><h2 className="text-xl font-bold mb-4">Project Board</h2><p className="text-gray-500">Full Kanban board is loading...</p></Card>}
                            </div>
                        </div>
                    </main>

                    {/* AI Button */}
                    <button className="fixed bottom-8 right-8 w-16 h-16 bg-gray-900 text-white rounded-full shadow-2xl flex items-center justify-center hover:scale-110 hover:-rotate-12 transition-all z-50 group">
                        <Sparkles size={28} className="text-yellow-300 group-hover:animate-pulse" />
                    </button>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<NexusApp />);
    </script>
</body>
</html>
