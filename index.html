      <div>

      Detach to Overlay (PiP)
    </div>
  </button>
</div>

<script>
const canvas = document.getElementById('viz');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const video = document.getElementById('pip');
const connectBtn = document.getElementById('connect-btn');
const overlayBtn = document.getElementById('overlay-btn');
const modeBtns = document.querySelectorAll('.mode-btn');
const uiLayer = document.getElementById('ui-layer');
const instructionText = document.getElementById('instruction-text');
const errorMsg = document.getElementById('error-msg');

let audioCtx, analyser, dataArray, bufferLength;
let mode = 0;
let particles = [];
let isConnected = false;
let animationId;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

modeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    modeBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = parseInt(btn.getAttribute('data-mode'));
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles = [];
  });
});

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.style.display = 'block';
  setTimeout(() => { errorMsg.style.display = 'none'; }, 6000);
}

connectBtn.addEventListener('click', async () => {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: false
      }
    });

    const audioTracks = stream.getAudioTracks();
    if (audioTracks.length === 0) {
      showError('No audio detected. Please re-connect and explicitly check the "Share audio" toggle.');
      stream.getTracks().forEach(t => t.stop());
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.85;

    const source = audioCtx.createMediaStreamSource(stream);
    source.connect(analyser);

    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);
    isConnected = true;

    connectBtn.style.display = 'none';
    instructionText.style.display = 'none';
    overlayBtn.style.display = 'block';
    errorMsg.style.display = 'none';

    if (animationId) cancelAnimationFrame(animationId);
    animate();
    
    stream.getVideoTracks()[0].addEventListener('ended', () => {
       isConnected = false;
       connectBtn.style.display = 'flex';
       overlayBtn.style.display = 'none';
       instructionText.style.display = 'block';
       ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

  } catch (err) {
    if (err.name !== 'NotAllowedError') {
      showError('Failed to capture audio. Ensure your browser supports this feature.');
    }
  }
});

overlayBtn.addEventListener('click', async () => {
  try {
    const stream = canvas.captureStream(30);
    video.srcObject = stream;
    await video.play();
    await video.requestPictureInPicture();
    uiLayer.classList.add('hidden-ui');
  } catch (err) {
    showError('Picture-in-Picture failed. Your browser might not support Canvas PiP.');
  }
});

video.addEventListener('leavepictureinpicture', () => {
  uiLayer.classList.remove('hidden-ui');
});

uiLayer.addEventListener('mouseenter', () => {
  if (document.pictureInPictureElement) {
    document.exitPictureInPicture().catch(() => {});
  }
});

function getAverageVolume() {
  let sum = 0;
  for (let i = 0; i < bufferLength; i++) {
    sum += dataArray[i];
  }
  return sum / bufferLength;
}

class Particle {
  constructor(x, y, v) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * v;
    this.vy = (Math.random() - 0.5) * v;
    this.life = 1;
    this.color = `hsl(${Math.random() * 40 + 120}, 100%, 50%)`;
    this.size = Math.random() * 5 + 2;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.02;
    this.size *= 0.95;
  }
  draw() {
    ctx.fillStyle = this.color;
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawBars() {
  const w = canvas.width;
  const h = canvas.height;
  const barWidth = (w / bufferLength) * 2.5;
  let x = 0;
  for (let i = 0; i < bufferLength; i++) {
    const barHeight = (dataArray[i] / 255) * h;
    const r = 29;
    const g = Math.floor(dataArray[i] / 255 * 185 + 70);
    const b = 84;
    ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
    ctx.fillRect(x, h - barHeight, barWidth, barHeight);
    x += barWidth + 2;
  }
}

function drawRadial() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.min(cx, cy) * 0.4;

  ctx.translate(cx, cy);
  for (let i = 0; i < bufferLength; i += 4) {
    const rad = (i / bufferLength) * Math.PI * 2;
    const barHeight = (dataArray[i] / 255) * (Math.min(cx, cy) * 0.5);
    
    const startX = Math.cos(rad) * radius;
    const startY = Math.sin(rad) * radius;
    const endX = Math.cos(rad) * (radius + barHeight);
    const endY = Math.sin(rad) * (radius + barHeight);

    ctx.strokeStyle = `hsl(${(i / bufferLength) * 60 + 120}, 100%, 50%)`;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);
    ctx.stroke();
  }
  ctx.translate(-cx, -cy);

  ctx.beginPath();
  ctx.arc(cx, cy, radius - 2, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0a0a';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#1DB954';
  ctx.stroke();
}

function drawWaveform() {
  analyser.getByteTimeDomainData(dataArray);
  const w = canvas.width;
  const h = canvas.height;
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#1DB954';
  ctx.shadowBlur = 10;
  ctx.shadowColor = '#1DB954';
  ctx.beginPath();
  const sliceWidth = w * 1.0 / bufferLength;
  let x = 0;
  for (let i = 0; i < bufferLength; i++) {
    const v = dataArray[i] / 128.0;
    const y = v * h / 2;
    if (i === 0) {
      ctx.moveTo(x, y);
    } else {
      ctx.lineTo(x, y);
    }
    x += sliceWidth;
  }
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  analyser.getByteFrequencyData(dataArray);
}

function drawParticles() {
  const vol = getAverageVolume();
  if (vol > 60) {
    const spawnCount = Math.floor(vol / 15);
    for (let i = 0; i < spawnCount; i++) {
      particles.push(new Particle(canvas.width / 2, canvas.height / 2, vol / 6));
    }
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }
  
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2, vol, 0, Math.PI*2);
  ctx.fillStyle = `rgba(29, 185, 84, ${vol/255})`;
  ctx.fill();
}

function drawNeonRings() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  ctx.translate(cx, cy);
  for(let i = 0; i < 6; i++) {
    const index = Math.floor(bufferLength / 6) * i;
    const val = dataArray[index] / 255;
    const r = 50 + i * 50 + val * 100;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.lineWidth = 3 + val * 8;
    ctx.strokeStyle = `hsla(${120 + i * 10}, 100%, 50%, ${0.2 + val})`;
    ctx.shadowBlur = 20;
    ctx.shadowColor = ctx.strokeStyle;
    ctx.stroke();
  }
  ctx.shadowBlur = 0;
  ctx.translate(-cx, -cy);
}

function drawEclipse() {
  const w = canvas.width;
  const h = canvas.height;
  const cx = w / 2;
  const cy = h / 2;
  const vol = getAverageVolume();
  
  const r = Math.min(w, h) * 0.2 + (vol / 255) * 120;
  const grad = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * 2.5);
  grad.addColorStop(0, '#000000');
  grad.addColorStop(0.2, `rgba(29, 185, 84, ${vol/255 + 0.2})`);
  grad.addColorStop(1, 'transparent');
  
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  
  ctx.beginPath();
  ctx.arc(cx, cy, r * 0.8, 0, Math.PI * 2);
  ctx.fillStyle = '#000';
  ctx.shadowBlur = 30;
  ctx.shadowColor = '#1DB954';
  ctx.fill();
  ctx.shadowBlur = 0;
}

function animate() {
  if (!isConnected) return;
  animationId = requestAnimationFrame(animate);

  if (mode !== 2) {
    analyser.getByteFrequencyData(dataArray);
  }

  ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  switch(mode) {
    case 0: drawBars(); break;
    case 1: drawRadial(); break;
    case 2: drawWaveform(); break;
    case 3: drawParticles(); break;
    case 4: drawNeonRings(); break;
    case 5: drawEclipse(); break;
  }
}
</script>
</body>
</html>
