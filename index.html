local js = require "js"
local window = js.global
local document = window.document
local previewArea = document:getElementById("ui-center-anchor")

_G.print = function(...)
    local args = {...}
    local str = ""
    for i, v in ipairs(args) do str = str .. tostring(v) .. "  " end
    window:uiPrint(str)
end

_G.warn = function(...)
    local args = {...}
    local str = ""
    for i, v in ipairs(args) do str = str .. tostring(v) .. "  " end
    window:uiWarn(str)
end

-- FUNCTOR PROPERTIES ENGINE: Allows pos(0, 50) and size(100, 100) syntax!
local function makeProp(name)
    local t = {propName = name}
    setmetatable(t, {
        __call = function(_, a, b)
            if b ~= nil then return {isProp = true, k = name, v = {a, b}} end
            return {isProp = true, k = name, v = a}
        end
    })
    return t
end

_G.pos = makeProp("pos")
_G.size = makeProp("size")
_G.radius = makeProp("radius")
_G.color = makeProp("color")
_G.bgColor = makeProp("bgColor")
_G.textColor = makeProp("textColor")
_G.text = makeProp("text")
_G.value = makeProp("value")
_G.fillval = makeProp("value") -- Alias for value
_G.state = makeProp("state")
_G.visible = makeProp("visible")
_G.options = makeProp("options")
_G.url = makeProp("url")
_G.layer = makeProp("layer")

local function parseCoord(c, defW, defH)
    if type(c) == "table" then return (c[1] or defW).."px", (c[2] or defH).."px" 
    elseif type(c) == "number" then return c.."px", c.."px" end
    return defW.."px", defH.."px"
end

local function parseColor(c, defColor)
    if type(c) == "table" then 
        local r, g, b, a = math.floor(tonumber(c[1]) or 255), math.floor(tonumber(c[2]) or 255), math.floor(tonumber(c[3]) or 255), tonumber(c[4]) or 1
        return "rgba("..r..","..g..","..b..","..a..")" 
    end
    if type(defColor) == "table" then
        local r, g, b, a = math.floor(tonumber(defColor[1]) or 255), math.floor(tonumber(defColor[2]) or 255), math.floor(tonumber(defColor[3]) or 255), tonumber(defColor[4]) or 1
        return "rgba("..r..","..g..","..b..","..a..")" 
    end
    return "transparent"
end

local function makeDraggable(el) window:makeElementDraggable(el) end

-- UNIVERSAL SUPER METHODS
local function addSharedMethods(obj, el)
    local initialDisplay = el.style.display
    function obj:setVisible(visible)
        el.style.display = (visible == false) and "none" or initialDisplay
    end
    function obj:hide() self:setVisible(false) end
    function obj:show() self:setVisible(true) end
    function obj:setBlur(radius)
        el.style.backdropFilter = "blur(" .. (tonumber(radius) or 0) .. "px)"
        el.style.webkitBackdropFilter = "blur(" .. (tonumber(radius) or 0) .. "px)"
    end
    local hoverEnabled = false
    function obj:setHoverEffect(enabled)
        hoverEnabled = enabled and true or false
        el.style.transition = hoverEnabled and "transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), filter 0.15s" or "none"
        if not hoverEnabled then 
            el.style.transform = "translate(-50%, 50%) scale(1)"
            el.style.filter = "brightness(1)" 
        end
    end
    
    -- Universal Setter (Handles both .set and :set perfectly)
    obj.set = function(...)
        local args = {...}
        for _, arg in ipairs(args) do
            if arg ~= obj then 
                if type(arg) == "table" and arg.isProp then
                    obj[arg.k] = arg.v
                elseif type(arg) ~= "table" then
                    if obj.setText then obj:setText(arg)
                    elseif obj.setValue then obj:setValue(arg)
                    elseif obj.setState then obj:setState(arg)
                    elseif obj.setSource then obj:setSource(arg) end
                end
            end
        end
    end

    -- Universal Modifier (Relative Changes like +50 or -50)
    obj.change = function(...)
        local args = {...}
        for _, arg in ipairs(args) do
            if arg ~= obj and type(arg) == "table" and arg.isProp then
                local k, delta = arg.k, arg.v
                local current = obj:get(k)
                
                if k == "pos" or k == "size" then
                    obj:set(k, { (current[1] or 0) + (delta[1] or 0), (current[2] or 0) + (delta[2] or 0) })
                elseif type(current) == "number" and type(delta) == "number" then
                    obj:set(k, current + delta)
                end
            end
        end
    end

    -- Universal Getter (Handles both .get and :get perfectly)
    obj.get = function(...)
        local args = {...}
        local p = nil
        for _, arg in ipairs(args) do
            if arg ~= obj then p = arg; break end
        end

        if type(p) == "table" and p.propName then return obj[p.propName] end
        if type(p) == "string" then return obj[p] end
        
        if obj.getText then return obj:getText()
        elseif obj.getValue then return obj:getValue()
        elseif obj.getState then return obj:getState()
        elseif obj.getSource then return obj:getSource() end
    end

    el:addEventListener("mousedown", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(0.92)" end end)
    el:addEventListener("mouseup", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(1.05)" end end)
    el:addEventListener("mouseleave", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.filter = "brightness(1)" end end)
    el:addEventListener("mouseenter", function() if hoverEnabled then el.style.transform = "translate(-50%, 50%) scale(1.05)"; el.style.filter = "brightness(1.15)" end end)

    -- METATABLE MAGIC & ACTION CHAIN ENGINE
    setmetatable(obj, {
        __index = function(t, k)
            if k == "text" and rawget(t, "getText") then return t:getText() end
            if k == "value" and rawget(t, "getValue") then return t:getValue() end
            if k == "state" and rawget(t, "getState") then return t:getState() end
            if k == "visible" then return el.style.display ~= "none" end
            if k == "pos" then 
                local x = el.style.left:gsub("px", ""); local y = el.style.bottom:gsub("px", "")
                return {tonumber(x) or 0, tonumber(y) or 0} 
            end
            if k == "size" then 
                local w = el.style.width:gsub("px", ""); local h = el.style.height:gsub("px", "")
                return {tonumber(w) or 0, tonumber(h) or 0} 
            end
            
            -- THE ACTION CHAIN BUILDER
            if k == "onClick" or k == "onChange" or k == "onSelect" then
                local builder = {}
                setmetatable(builder, {
                    __call = function(_, targetObj)
                        local proxy = {}
                        setmetatable(proxy, {
                            __index = function(_, methodStr)
                                return function(...)
                                    local actionArgs = {...}
                                    -- Save the generated function to the component's internal action hook
                                    rawset(t, "_action", function(eventVal)
                                        if type(targetObj[methodStr]) == "function" then
                                            if #actionArgs > 0 then
                                                targetObj[methodStr](table.unpack(actionArgs))
                                            else
                                                -- If no args provided, pass the event value (like true/false)
                                                targetObj[methodStr](eventVal)
                                            end
                                        end
                                    end)
                                end
                            end
                        })
                        return proxy
                    end
                })
                return builder
            end
            
            return rawget(t, k)
        end,
        __newindex = function(t, k, v)
            if k == "text" and rawget(t, "setText") then t:setText(v)
            elseif k == "value" and rawget(t, "setValue") then t:setValue(v)
            elseif k == "state" and rawget(t, "setState") then t:setState(v)
            elseif k == "options" and rawget(t, "setOptions") then t:setOptions(v)
            elseif k == "visible" and rawget(t, "setVisible") then t:setVisible(v)
            elseif k == "pos" then
                local x, y = parseCoord(v, 0, 0)
                el.style.left = x; el.style.bottom = y
            elseif k == "size" then
                local w, h = parseCoord(v, 100, 100)
                el.style.width = w; el.style.height = h
            elseif k == "radius" then
                el.style.borderRadius = (tonumber(v) or 0) .. "px"
            elseif k == "color" or k == "bgColor" then
                el.style.backgroundColor = parseColor(v, {0,0,0,0})
            -- Standard Assignment Fallback
            elseif k == "onClick" or k == "onChange" or k == "onSelect" then
                if type(v) == "string" then rawset(t, "_action", load(v))
                else rawset(t, "_action", v) end
            else rawset(t, k, v) end
        end
    })
end

local function addTextMethods(obj, el, textSpan)
    function obj:setText(newText) textSpan.innerText = tostring(newText) end
    function obj:getText() return textSpan.innerText end
    function obj:setTextPlacement(centered, offsets)
        el.style.justifyContent = "center"; el.style.alignItems = "center"
        if centered then textSpan.style.transform = "translate(0, 0)"
        else
            local ox, oy = 0, 0
            if type(offsets) == "table" then ox, oy = offsets[1] or 0, offsets[2] or 0 end
            textSpan.style.transform = "translate("..(ox).."px, "..(-oy).."px)"
        end
    end
end

_G.frame = {}
function _G.frame.new(size, pos, color, radius, layer)
    local el = document:createElement("div"); el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 100); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"
    el.style.backgroundColor = parseColor(color, {0,0,0,0})
    el.style.borderRadius = (radius or 0).."px"; el.style.zIndex = tostring(layer or 1)
    previewArea:appendChild(el); local obj = { element = el }
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el); return obj
end

_G.imageframe = {}
function _G.imageframe.new(size, pos, url, radius, layer)
    local el = document:createElement("div"); el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 100); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.borderRadius = (radius or 0).."px"
    el.style.zIndex = tostring(layer or 1); el.style.backgroundSize = "cover"; el.style.backgroundPosition = "center"
    if url then el.style.backgroundImage = "url('"..url.."')" end
    previewArea:appendChild(el); local obj = { element = el }
    function obj:setSource(u) el.style.backgroundImage = "url('"..u.."')" end
    function obj:getSource() return el.style.backgroundImage end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el); return obj
end

_G.btn = {}
function _G.btn.new(size, pos, color, radius, text, textColor, layer)
    local el = document:createElement("button"); el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 50); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.backgroundColor = parseColor(color, {49, 50, 68})
    el.style.borderRadius = (radius or 0).."px"; el.style.zIndex = tostring(layer or 1); el.style.overflow = "hidden"
    local fillBar = document:createElement("div")
    fillBar.style.position = "absolute"; fillBar.style.left = "0"; fillBar.style.top = "0"; fillBar.style.bottom = "0"
    fillBar.style.width = "0%"; fillBar.style.backgroundColor = "rgba(255, 255, 255, 0.25)"; fillBar.style.pointerEvents = "none"
    el:appendChild(fillBar)
    local textSpan = document:createElement("span"); textSpan.innerText = text or ""
    textSpan.style.pointerEvents = "none"; textSpan.style.position = "relative"; textSpan.style.zIndex = "10"
    el:appendChild(textSpan)
    el.style.border = "none"; el.style.cursor = "pointer"; el.style.color = parseColor(textColor, {255, 255, 255})
    el.style.fontFamily = "sans-serif"; el.style.fontWeight = "bold"; el.style.display = "flex"
    el.style.alignItems = "center"; el.style.justifyContent = "center"; el.style.boxShadow = "0 4px 6px -1px rgba(0, 0, 0, 0.1)"
    
    local obj = { element = el }
    local holdEnabled, showHoldBar, holdDuration, holdTimer = false, true, 1000, nil
    local function clearHold()
        if holdTimer then window:clearTimeout(holdTimer); holdTimer = nil end
        fillBar.style.transition = "none"; fillBar.style.width = "0%"
    end
    el:addEventListener("mousedown", function() 
        if holdEnabled then
            if showHoldBar then fillBar.style.transition = "width "..holdDuration.."ms linear"; fillBar.style.width = "100%" end
            holdTimer = window:setTimeout(function()
                holdTimer = nil
                if showHoldBar then fillBar.style.transition = "opacity 0.2s"; fillBar.style.opacity = "0"; window:setTimeout(function() fillBar.style.transition = "none"; fillBar.style.width = "0%"; fillBar.style.opacity = "1" end, 200) end
                if obj._action then obj._action() end
            end, holdDuration)
        end
    end)
    el:addEventListener("mouseup", clearHold); el:addEventListener("mouseleave", clearHold)
    el:addEventListener("click", function() if not holdEnabled and obj._action then obj._action() end end)
    previewArea:appendChild(el)
    
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    function obj:setHold(e, d, s) holdEnabled = e and true or false; if type(d) == "number" then holdDuration = d * 1000 end; showHoldBar = (s == nil) and true or (s and true or false) end
    addTextMethods(obj, el, textSpan); addSharedMethods(obj, el); obj:setHoverEffect(true); return obj
end

_G.label = {}
function _G.label.new(size, pos, text, textColor, textSize, layer)
    local el = document:createElement("div"); el.style.position = "absolute"
    local w, h = parseCoord(size, 100, 30); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.color = parseColor(textColor, {255, 255, 255})
    el.style.fontSize = (textSize or 14).."px"; el.style.zIndex = tostring(layer or 1)
    local textSpan = document:createElement("span"); textSpan.innerText = text or "Label"; el:appendChild(textSpan)
    el.style.fontFamily = "sans-serif"; el.style.display = "flex"; el.style.alignItems = "center"; el.style.justifyContent = "center"
    previewArea:appendChild(el); local obj = { element = el }
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addTextMethods(obj, el, textSpan); addSharedMethods(obj, el); return obj
end

_G.input = {}
function _G.input.new(size, pos, placeholder, bgColor, textColor, radius, layer)
    local el = document:createElement("input"); el.type = "text"; el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 40); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"; el.placeholder = placeholder or "Enter text..."
    el.style.backgroundColor = parseColor(bgColor, {17, 17, 27}); el.style.color = parseColor(textColor, {205, 214, 244})
    el.style.borderRadius = (radius or 4).."px"; el.style.zIndex = tostring(layer or 1); el.style.border = "1px solid #313244"
    el.style.padding = "0 10px"; el.style.outline = "none"; el.style.fontFamily = "sans-serif"
    el:addEventListener("focus", function() el.style.borderColor = "#89b4fa" end)
    el:addEventListener("blur", function() el.style.borderColor = "#313244" end)
    previewArea:appendChild(el); local obj = { element = el }
    function obj:getText() return el.value end; function obj:setText(t) el.value = tostring(t) end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el); return obj
end

_G.progressbar = {}
function _G.progressbar.new(size, pos, bgColor, fillValue, fillColor, radius, layer)
    local el = document:createElement("div"); el.style.position = "absolute"
    local w, h = parseCoord(size, 200, 20); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.backgroundColor = parseColor(bgColor, {17, 17, 27})
    el.style.borderRadius = (radius or 8).."px"; el.style.overflow = "hidden"; el.style.zIndex = tostring(layer or 1)
    local fillEl = document:createElement("div"); fillEl.style.height = "100%"
    fillEl.style.backgroundColor = parseColor(fillColor, {203, 166, 247})
    
    -- Now exclusively operates on a 0 to 100 percentage scale
    local initialFill = math.max(0, math.min(100, tonumber(fillValue) or 0))
    fillEl.style.width = initialFill .. "%"; fillEl.style.transition = "width 0.3s ease"; el:appendChild(fillEl)
    
    previewArea:appendChild(el); local obj = { element = el, fillEl = fillEl }
    function obj:setValue(v) fillEl.style.width = math.max(0, math.min(100, tonumber(v) or 0)).."%" end
    function obj:getValue() return tonumber(fillEl.style.width:sub(1, -2)) or 0 end
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el); return obj
end

_G.toggle = {}
function _G.toggle.new(size, pos, activeColor, inactiveColor, startState, layer)
    local el = document:createElement("div"); el.style.position = "absolute"
    local w, h = parseCoord(size, 50, 26); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.borderRadius = "999px"; el.style.cursor = "pointer"
    el.style.zIndex = tostring(layer or 1); el.style.transition = "background-color 0.3s"
    local ac, ic = parseColor(activeColor, {166, 227, 161}), parseColor(inactiveColor, {69, 71, 90})
    local state = startState and true or false; el.style.backgroundColor = state and ac or ic
    local hNum = tonumber(string.match(h, "%d+")) or 26; local knobSize = (hNum - 4).."px"
    local knob = document:createElement("div"); knob.style.position = "absolute"; knob.style.top = "2px"
    knob.style.width, knob.style.height = knobSize, knobSize; knob.style.backgroundColor = "#ffffff"; knob.style.borderRadius = "50%"
    knob.style.transition = "left 0.3s"; knob.style.left = state and "calc(100% - "..knobSize.." - 2px)" or "2px"; el:appendChild(knob)
    
    local obj = { element = el, state = state }
    
    el:addEventListener("click", function()
        obj.set(obj, not obj.state)
        if obj._action then obj._action(obj.state) end
    end)
    
    function obj:getState() return self.state end
    function obj:setState(s)
        self.state = s and true or false
        el.style.backgroundColor = self.state and ac or ic
        knob.style.left = self.state and "calc(100% - "..knobSize.." - 2px)" or "2px"
    end
    
    previewArea:appendChild(el)
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el); return obj
end

_G.dropdown = {}
function _G.dropdown.new(size, pos, optionsOrMin, max, step, bgColor, textColor, radius, layer)
    local el = document:createElement("select"); el.style.position = "absolute"
    local w, h = parseCoord(size, 150, 40); el.style.width, el.style.height = w, h
    local x, y = parseCoord(pos, 0, 0); el.style.left, el.style.bottom = x, y
    el.style.transform = "translate(-50%, 50%) scale(1)"; el.style.backgroundColor = parseColor(bgColor, {24, 24, 37})
    el.style.color, el.style.borderRadius = parseColor(textColor, {205, 214, 244}), (radius or 4).."px"
    el.style.zIndex, el.style.border, el.style.padding = tostring(layer or 1), "1px solid #313244", "0 10px"
    el.style.outline, el.style.fontFamily, el.style.cursor = "none", "sans-serif", "pointer"
    
    local obj = { element = el }
    
    function obj:setOptions(opts)
        el.innerHTML = ""
        if type(opts) == "table" then 
            for _, opt in ipairs(opts) do
                local optionEl = document:createElement("option"); optionEl.value, optionEl.innerText = tostring(opt), tostring(opt)
                el:appendChild(optionEl)
            end 
        end
    end
    function obj:setRange(startN, endN, inc)
        el.innerHTML = ""
        startN, endN, inc = tonumber(startN) or 0, tonumber(endN) or 100, tonumber(inc) or 1
        for i = startN, endN, inc do
            local optionEl = document:createElement("option"); optionEl.value, optionEl.innerText = tostring(i), tostring(i)
            el:appendChild(optionEl)
        end
    end
    
    if type(optionsOrMin) == "table" then obj:setOptions(optionsOrMin)
    elseif optionsOrMin ~= nil then obj:setRange(optionsOrMin, max, step) end
    
    function obj:setValue(val) el.value = tostring(val) end
    function obj:getValue() return tonumber(el.value) or el.value end

    el:addEventListener("change", function() if obj._action then obj._action(obj:get()) end end)
    
    previewArea:appendChild(el)
    function obj:setDraggable(d) if d then makeDraggable(el) end end
    addSharedMethods(obj, el); return obj
end
    </script>

    <script>
        const signatures = {
            'frame.new': ['size: {w, h}', 'pos: {x, y}', 'color: {r,g,b,a}', 'radius: px', 'layer: num'],
            'btn.new': ['size: {w, h}', 'pos: {x, y}', 'color: {r,g,b,a}', 'radius: px', 'text: str', 'textColor: {r,g,b}', 'layer: num'],
            'label.new': ['size: {w, h}', 'pos: {x, y}', 'text: str', 'textColor: {r,g,b}', 'textSize: px', 'layer: num'],
            'input.new': ['size: {w, h}', 'pos: {x, y}', 'placeholder: str', 'bgColor: {r,g,b}', 'textColor: {r,g,b}', 'radius: px', 'layer: num'],
            'imageframe.new': ['size: {w, h}', 'pos: {x, y}', 'url: str', 'radius: px', 'layer: num'],
            'progressbar.new': ['size: {w, h}', 'pos: {x, y}', 'bgColor: {r,g,b}', 'fillVal: 0-100', 'fillColor: {r,g,b}', 'radius: px', 'layer: num'],
            'toggle.new': ['size: {w, h}', 'pos: {x, y}', 'activeColor: {r,g,b}', 'inactiveColor: {r,g,b}', 'startState: bool', 'layer: num'],
            'dropdown.new': ['size: {w, h}', 'pos: {x, y}', 'options OR min', 'max', 'step', 'bgColor: {r,g,b}', 'textColor: {r,g,b}', 'radius: px', 'layer: num'],
            ':setTextPlacement': ['centered: bool', 'offsets: {x, y}'],
            ':setHold': ['enabled: bool', 'duration: sec', 'showBar: bool'],
            ':setBlur': ['radius: px'],
            ':setHoverEffect': ['enabled: bool'],
            ':set': ['prop(val)', '...'],
            '.set': ['prop(val)', '...'],
            ':change': ['prop(val)', '...'],
            '.change': ['prop(val)', '...'],
            ':get': ['prop'],
            '.get': ['prop'],
            ':hide': [],
            ':show': [],
            ':setDraggable': ['enabled: bool'],
            '.onClick': ['(targetObj)', '.method(...)'],
            '.onChange': ['(targetObj)', '.method(...)'],
            '.onSelect': ['(targetObj)', '.method(...)']
        };

        let editor;
        let lastMousePos = { x: 0, y: 0 };
        let isMouseInEditor = false;

        document.addEventListener("DOMContentLoaded", () => {
            const overlay = document.getElementById('fullscreen-overlay');
            document.getElementById('btn-enter-fullscreen').onclick = () => { document.documentElement.requestFullscreen().catch(e=>console.warn(e)); overlay.classList.add('hidden'); };
            document.getElementById('btn-enter-windowed').onclick = () => overlay.classList.add('hidden');

            const preview = document.getElementById('ui-preview'), coordDisplay = document.getElementById('coord-display');
            preview.onmousemove = (e) => {
                const rect = preview.getBoundingClientRect(), x = Math.round(e.clientX - (rect.left + rect.width / 2)), y = Math.round((rect.top + rect.height / 2) - e.clientY);
                coordDisplay.innerText = `x: ${x}, y: ${y}`;
                coordDisplay.classList.add('text-[#89b4fa]', 'border-[#89b4fa]');
            };
            preview.onmouseleave = () => { coordDisplay.innerText = 'x: 0, y: 0'; coordDisplay.classList.remove('text-[#89b4fa]', 'border-[#89b4fa]'); };

            editor = ace.edit("editor");
            editor.setTheme("ace/theme/tomorrow_night_eighties");
            editor.session.setMode("ace/mode/lua");
            editor.setOptions({ fontFamily: "ui-monospace, monospace", fontSize: "14px", enableBasicAutocompletion: true, enableLiveAutocompletion: true, tabSize: 4 });

            const tooltipEl = document.getElementById('param-tooltip');

            const getContextAt = (row, col) => {
                const line = editor.session.getLine(row);
                if (!line) return { funcName: null, argIdx: -1 };

                const isInsideString = (text, pos) => {
                    let inS = false; let q = null;
                    for(let i=0; i < pos; i++) {
                        if(!inS && (text[i]==='"' || text[i]==="'")) { inS=true; q=text[i]; }
                        else if(inS && text[i]===q && text[i-1]!=='\\') { inS=false; }
                    }
                    return inS;
                };

                let depth = 0, openIdx = -1;
                for (let i = col - 1; i >= 0; i--) {
                    if (isInsideString(line, i)) continue;
                    if (line[i] === ')') depth++;
                    else if (line[i] === '(') { 
                        if (depth === 0) { openIdx = i; break; } 
                        else depth--; 
                    }
                }

                if (openIdx !== -1) {
                    const prefix = line.substring(0, openIdx);
                    const match = prefix.match(/([a-zA-Z0-9_]+(?:\.[a-zA-Z0-9_]+)?|[:.][a-zA-Z0-9_]+)\s*$/);
                    let funcName = null;
                    if (match) {
                        const rawName = match[1];
                        if (signatures[rawName]) funcName = rawName;
                        else if (rawName.includes(':') || rawName.includes('.')) {
                            const methodOnly = ":" + rawName.replace(/.*[:.]/, '');
                            const methodOnlyDot = "." + rawName.replace(/.*[:.]/, '');
                            if (signatures[methodOnly]) funcName = methodOnly;
                            else if (signatures[methodOnlyDot]) funcName = methodOnlyDot;
                        }
                    }

                    if (funcName) {
                        let fDepth = 0, inS = false, qC = null, argIdx = 0;
                        for (let i = openIdx + 1; i < col; i++) {
                            const char = line[i];
                            if (!inS) {
                                if (char === '"' || char === "'") { inS = true; qC = char; }
                                else if (char === '(' || char === '{' || char === '[') fDepth++;
                                else if (char === ')' || char === '}' || char === ']') fDepth--;
                                else if (char === ',' && fDepth === 0) argIdx++;
                            } else {
                                if (char === qC && line[i-1] !== '\\') inS = false;
                            }
                        }
                        return { funcName, argIdx };
                    }
                }

                let start = col, end = col;
                while (start > 0 && /[a-zA-Z0-9_.:]/.test(line[start-1])) start--;
                while (end < line.length && /[a-zA-Z0-9_.:]/.test(line[end])) end++;
                
                let word = line.substring(start, end).trim();
                if (signatures[word]) return { funcName: word, argIdx: -1 };
                
                if (word.includes(':') || word.includes('.')) {
                    const methodOnly = ":" + word.replace(/.*[:.]/, '');
                    const methodOnlyDot = "." + word.replace(/.*[:.]/, '');
                    if (signatures[methodOnly]) return { funcName: methodOnly, argIdx: -1 };
                    else if (signatures[methodOnlyDot]) return { funcName: methodOnlyDot, argIdx: -1 };
                }

                let forwardParen = line.indexOf('(', col);
                if (forwardParen !== -1) {
                    let preParen = line.substring(0, forwardParen);
                    let m = preParen.match(/([a-zA-Z0-9_]+(?:\.[a-zA-Z0-9_]+)?|[:.][a-zA-Z0-9_]+)\s*$/);
                    if (m) {
                        let name = m[1];
                        if (name.includes(':') || name.includes('.')) {
                            localTest = ":" + name.replace(/.*[:.]/, '');
                            if(signatures[localTest]) name = localTest;
                            else name = "." + name.replace(/.*[:.]/, '');
                        }
                        if (signatures[name]) return { funcName: name, argIdx: -1 };
                    }
                }

                return { funcName: null, argIdx: -1 };
            };

            const updateTooltipUI = (ctx, displayPos) => {
                if (ctx.funcName) {
                    const sig = signatures[ctx.funcName];
                    let html = `<span class="text-[#89b4fa] font-bold">${ctx.funcName}</span>( `;
                    if (sig.length === 0) {
                        html += ')';
                    } else {
                        sig.forEach((param, i) => {
                            if (i === ctx.argIdx || ((ctx.funcName.includes("set") || ctx.funcName.includes("change")) && param.includes("prop"))) {
                                html += `<span class="text-[#a6e3a1] font-bold px-1 bg-[#a6e3a1]/20 rounded border border-[#a6e3a1]/30 animate-pulse">${param}</span>`;
                            } else {
                                html += `<span class="text-[#a6adc8]">${param}</span>`;
                            }
                            if (i < sig.length - 1) html += '<span class="text-[#6c7086]">, </span>';
                        });
                        html += ' )';
                    }
                    
                    tooltipEl.innerHTML = html;
                    tooltipEl.style.left = (displayPos.x + 10) + 'px';
                    tooltipEl.style.top = (displayPos.y - 45) + 'px';
                    tooltipEl.classList.remove('hidden');
                    tooltipEl.style.opacity = '1';
                } else {
                    tooltipEl.classList.add('hidden');
                    tooltipEl.style.opacity = '0';
                }
            };

            editor.container.addEventListener("mousemove", (e) => {
                lastMousePos = { x: e.clientX, y: e.clientY };
                const textPos = editor.renderer.screenToTextCoordinates(e.clientX, e.clientY);
                const ctx = getContextAt(textPos.row, textPos.column);
                
                if (ctx.funcName) {
                    updateTooltipUI(ctx, lastMousePos);
                } else {
                    const cursor = editor.getCursorPosition();
                    const cursorCtx = getContextAt(cursor.row, cursor.column);
                    const screenPos = editor.renderer.textToScreenCoordinates(cursor.row, cursor.column);
                    updateTooltipUI(cursorCtx, { x: screenPos.pageX, y: screenPos.pageY });
                }
            });

            editor.container.addEventListener("mouseenter", () => isMouseInEditor = true);
            editor.container.addEventListener("mouseleave", () => {
                isMouseInEditor = false;
                const cursor = editor.getCursorPosition();
                const cursorCtx = getContextAt(cursor.row, cursor.column);
                const screenPos = editor.renderer.textToScreenCoordinates(cursor.row, cursor.column);
                updateTooltipUI(cursorCtx, { x: screenPos.pageX, y: screenPos.pageY });
            });

            editor.on("changeSelection", () => {
                if (!isMouseInEditor) {
                    const cursor = editor.getCursorPosition();
                    const ctx = getContextAt(cursor.row, cursor.column);
                    const screenPos = editor.renderer.textToScreenCoordinates(cursor.row, cursor.column);
                    updateTooltipUI(ctx, { x: screenPos.pageX, y: screenPos.pageY });
                }
            });

            editor.on("change", () => {
                const cursor = editor.getCursorPosition();
                const ctx = getContextAt(cursor.row, cursor.column);
                const screenPos = editor.renderer.textToScreenCoordinates(cursor.row, cursor.column);
                updateTooltipUI(ctx, { x: screenPos.pageX, y: screenPos.pageY });
            });

            editor.on("blur", () => { tooltipEl.classList.add('hidden'); tooltipEl.style.opacity = '0'; });

            const langTools = ace.require("ace/ext/language_tools");
            langTools.addCompleter({
                getCompletions: (editor, session, pos, prefix, callback) => {
                    const words = Object.keys(signatures).map(k => ({ caption: k, value: k, meta: k.startsWith(':') || k.startsWith('.') ? "Method" : "Object", score: 1000 }));
                    
                    words.push({caption: 'pos(x, y)', value: 'pos', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'size(w, h)', value: 'size', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'radius(px)', value: 'radius', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'color({r,g,b})', value: 'color', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'text("str")', value: 'text', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'value(num)', value: 'value', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'fillval(num)', value: 'fillval', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'visible(bool)', value: 'visible', meta: 'Property Functor', score: 1100});
                    words.push({caption: 'state(bool)', value: 'state', meta: 'Property Functor', score: 1100});
                    
                    words.push({caption: '.onClick', value: 'onClick', meta: 'Event', score: 900});
                    words.push({caption: '.onChange', value: 'onChange', meta: 'Event', score: 900});
                    words.push({caption: '.onSelect', value: 'onSelect', meta: 'Event', score: 900});
                    
                    callback(null, words);
                }
            });

            editor.setValue(document.getElementById('default-lua').textContent.trim(), -1);
            setTimeout(runScript, 300);
        });

        function togglePreviewFullscreen() { const p = document.getElementById('ui-preview'); if (document.fullscreenElement === p) document.exitFullscreen(); else p.requestFullscreen(); }
        
        window.makeElementDraggable = function(el) {
            let isDragging = false, startX, startY, initX, initY;
            const move = (e) => { if (!isDragging) return; el.style.left = (initX + (e.clientX - startX)) + "px"; el.style.bottom = (initY + (startY - e.clientY)) + "px"; };
            const stop = () => { isDragging = false; document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", stop); };
            el.onmousedown = (e) => {
                if (['INPUT', 'SELECT'].includes(e.target.tagName)) return;
                isDragging = true; startX = e.clientX; startY = e.clientY; initX = parseFloat(el.style.left) || 0; initY = parseFloat(el.style.bottom) || 0;
                document.addEventListener("mousemove", move); document.addEventListener("mouseup", stop);
            };
        };

        function runScript() {
            document.getElementById('ui-center-anchor').innerHTML = "";
            const code = editor.getValue();
            try {
                fengari.load(document.getElementById('framework-lua').textContent)();
                fengari.load(code, "main.lua")();
            } catch(err) { uiError(err.toString()); }
        }

        function formatCode() {
            let lines = editor.getValue().split('\n'), indent = 0, out = [];
            for (let line of lines) {
                line = line.trim(); if (!line) { out.push(''); continue; }
                if (line.match(/^(end|elseif|else|until)\b/) || line.match(/^}/)) indent = Math.max(0, indent - 1);
                out.push('    '.repeat(indent) + line);
                if (line.match(/\bthen\b\s*(--.*)?$/) || line.match(/\bdo\b\s*(--.*)?$/) || line.match(/\bfunction.*[^{]\s*(--.*)?$/) || line.match(/^else\b/) || line.match(/^elseif\b/) || line.match(/\brepeat\b\s*(--.*)?$/) || line.match(/{\s*(--.*)?$/)) indent++;
            }
            editor.setValue(out.join('\n'), -1);
        }

        function copyCode() { navigator.clipboard.writeText(editor.getValue()); uiPrint("Code copied!", "text-[#a6e3a1]"); }
        window.uiPrint = function(m, c) { appendLog(m, c || "text-[#cdd6f4]"); }
        function uiError(m) { appendLog(`[ERROR] ${m}`, "text-[#f38ba8] bg-[#f38ba8]/10 border-l-2 border-[#f38ba8] pl-2"); }
        function appendLog(m, c) {
            const div = document.getElementById('console-output'), line = document.createElement('div'), now = new Date();
            line.innerHTML = `<span class="text-[#6c7086] mr-2">[${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}]</span> <span>${m}</span>`;
            line.className = `py-1 border-b border-[#313244]/30 ${c}`;
            div.appendChild(line); div.scrollTop = div.scrollHeight;
        }
        function clearConsole() { document.getElementById('console-output').innerHTML = ''; }
    </script>
